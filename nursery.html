      function showSpecimenNarration(em, mode = "inspect") {
        lastCustomNarration = { idx: em.index, mode };
        const c = em.cfg;
        if (mode === "event") {
          const note = uiLang === "en"
            ? `${c.catalystEn}  ·  ${c.rootEn} → ${c.slangEn}`
            : `${c.catalystZh}  ·  ${c.rootZh} → ${c.slangZh}`;
          setNarration(uiLang === "en" ? c.whisperEn : c.whisperZh, note, true);
        } else {
          const note = uiLang === "en"
            ? `${c.rootEn} → ${c.slangEn}`
            : `${c.rootZh} → ${c.slangZh}`;
          setNarration(uiLang === "en" ? c.whisperEn : c.whisperZh, note, true);
        }
      }

      function finishIntroImmediately() {
        introElapsed = INTRO_DURATION; introPaused = false; introComplete = true;
        sdfCanvas.style.display = "none";
        membraneUniforms.uCamHole.value = 0.0;
        camera.position.set(0, 0.06, PANORAMA_CAM_Z);
        camera.lookAt(0, PANORAMA_LOOK_Y, 0);
        camera.fov = 42; camera.updateProjectionMatrix();
        hairlineFillEl.style.width = "100%";
        hairlineProgressEl.classList.add("is-done");
        resetAllSpecimens(true);
        currentBeatIdx = NARRATION_BEATS.length - 1;
        const b = NARRATION_BEATS[currentBeatIdx][uiLang];
        setNarration(b.line, b.note, false);
        syncControlLabels();
      }

      function replayOneShotJourney() {
        introElapsed = 0; introPaused = false; introComplete = false;
        currentBeatIdx = -1; lastCustomNarration = null;
        sealRippleFired = false; awakenEchoStage = 0; autoCatalystCooldown = 7.5;
        sdfCanvas.style.display = "block";
        hairlineProgressEl.classList.remove("is-done");
        hairlineFillEl.style.width = "0%";
        cellWorldGroup.rotation.set(0, 0, 0); rotVelX = rotVelY = 0; targetCamZ = PANORAMA_CAM_Z;
        resetAllSpecimens(true);
        syncControlLabels();
        updateIntroNarration(0);
      }

      pauseBtnEl.addEventListener("click", () => {
        if (introComplete) return;
        introPaused = !introPaused;
        syncControlLabels();
      });
      skipReplayBtnEl.addEventListener("click", () => {
        if (introComplete) replayOneShotJourney();
        else finishIntroImmediately();
      });
      langBtnEl.addEventListener("click", () => {
        uiLang = uiLang === "en" ? "zh" : "en";
        syncControlLabels();
        if (introComplete && lastCustomNarration && embryos[lastCustomNarration.idx]) {
          showSpecimenNarration(embryos[lastCustomNarration.idx], lastCustomNarration.mode);
        } else {
          const b = NARRATION_BEATS[Math.max(0, currentBeatIdx)][uiLang];
          setNarration(b.line, b.note, false);
        }
      });

      function setOrganismDepthLayer(em, isInFront) {
        const order = isInFront ? 8 : 4;
        em.bodyMesh.renderOrder = em.hasCustomGlb ? order + 1 : order;
        em.coreGlyphSprite.renderOrder = order;
        em.traitGroup.children.forEach((c) => (c.renderOrder = order));
        em.mutantCluster.children.forEach((c) => (c.renderOrder = order));
        em.budGroup.children.forEach((c) => (c.renderOrder = order));
        if (em.hasCustomGlb) {
          em.customGlbSlot.traverse((node) => { if (node.isMesh) node.renderOrder = order; });
        }
      }

      function triggerMembraneEmerge(em) {
        if (!em || em.state === "emerged" || em.state === "emerging") return;
        em.state = "emerging"; em.stateTimer = 0; em.attention = 1.0; em.usageEnergy = 1.0;
        membraneUniforms.uBreachDir.value[em.index].copy(em.dir);
        membraneUniforms.uBreachWave.value[em.index].set(0.0, 1.0, 0.0, 0.0);
        em.burstField.group.position.copy(em.dir).multiplyScalar(MEMBRANE_RADIUS + 0.24);
        em.burstField.group.visible = true;
        em.burstField.uniforms.uBurstTime.value = performance.now() * 0.001;
        em.burstField.uniforms.uActive.value = 1.0;
        emitContagionWave(em.pos, em.cfg.color, 1.25);
        echoFilaments.spawnBurst(em.index, 10, em.cfg.color, em.cfg.accent);
        showSpecimenNarration(em, "emerged");
      }

      function injectUsageEcho(em, boost = 0.3) {
        if (!em || em.state === "emerged" || em.state === "emerging") return;
        selectedIndex = em.index;
        em.usageEnergy = Math.min(1.0, em.usageEnergy + boost);
        em.attention = Math.min(1.0, Math.max(em.attention, em.usageEnergy * 0.85) + 0.18);
        em.catalystFlash = Math.max(em.catalystFlash, 0.55);
        if (em.state === "drifting" || em.state === "receding") em.state = "rising";
        echoFilaments.spawnBurst(em.index, 7, em.cfg.color, em.cfg.accent);
        emitContagionWave(em.pos, em.cfg.color, 0.72 + em.usageEnergy * 0.4);
        if (em.usageEnergy >= 0.96 && (em.state === "pressing" || em.radius >= MEMBRANE_RADIUS - 0.55)) {
          triggerMembraneEmerge(em);
        } else {
          showSpecimenNarration(em, "inspect");
        }
      }

      function triggerCatalystEvent(preferredIdx = -1) {
        let targetIdx = preferredIdx;
        if (targetIdx < 0 || !embryos[targetIdx] || embryos[targetIdx].state === "emerged" || embryos[targetIdx].state === "emerging") {
          const candidates = embryos.filter((e) => e.state !== "emerged" && e.state !== "emerging");
          if (!candidates.length) { resetAllSpecimens(false); targetIdx = 0; }
          else targetIdx = candidates[Math.floor(Math.random() * candidates.length)].index;
        }
        const em = embryos[targetIdx];
        selectedIndex = targetIdx; autoCatalystCooldown = 16.0;
        catalystBeam.fireAt(targetIdx);
        showSpecimenNarration(em, "event");
      }

      function handleSpecimenClick(em) {
        if (!em) return;
        selectedIndex = em.index;
        if (em.state === "emerged") {
          em.state = "drifting"; em.radius = MEMBRANE_RADIUS * 0.48; em.pushHeight = em.attention = em.usageEnergy = 0; em.stateTimer = 3.6;
          em.burstField.uniforms.uActive.value = 0; em.burstField.group.visible = false; setOrganismDepthLayer(em, false);
          return;
        }
        injectUsageEcho(em, 0.3);
      }

      function shuffleLexiconCohort() {
        activeCohort = (activeCohort + 1) % 2;
        embryos.forEach((em, idx) => em.applyConfig(getSpecimenConfig(idx)));
        selectedIndex = 0;
        lastCustomNarration = null;
        resetAllSpecimens(true);
        membraneUniforms.uPokeDir.value.set(0, 0, 1);
        membraneUniforms.uPokeWave.value.set(0.0, 0.85, 0.0, 0.0);
        const list = embryos.map((e) => e.cfg.word).join(" · ");
        setNarration(
          uiLang === "en"
            ? "Another group of ordinary words drifts up toward the membrane."
            : "另一批普通词根从深处浮向膜壁。",
          list,
          true
        );
      }

      function resetAllSpecimens(silent = false) {
        embryos.forEach((em, idx) => {
          const cfg = em.cfg;
          em.state = cfg.initialState; em.dir.copy(cfg.homeDir);
          em.radius = cfg.initialState === "pressing" ? MEMBRANE_RADIUS + 0.04 : cfg.initialState === "rising" ? MEMBRANE_RADIUS * 0.68 : MEMBRANE_RADIUS * (0.46 + idx * 0.035);
          em.pos.copy(introComplete ? em.dir.clone().multiplyScalar(em.radius) : em.streamP0);
          em.pushHeight = introComplete && cfg.initialState === "pressing" ? 0.52 : 0;
          em.strainIntensity = introComplete && cfg.initialState === "pressing" ? 0.62 : 0;
          em.morph = introComplete ? 1.0 : 0.0;
          em.root.scale.setScalar(introComplete ? 1.0 : 0.44);
          em.root.visible = introComplete;
          em.attention = 0; em.catalystFlash = 0;
          em.usageEnergy = cfg.initialState === "pressing" ? 0.36 : cfg.initialState === "rising" ? 0.14 : 0;
          em.mutation = introComplete ? (cfg.initialState === "pressing" ? 0.34 : cfg.initialState === "rising" ? 0.14 : 0) : 0;
          em.metamorphosis = introComplete && cfg.initialState === "pressing" ? 0.26 : 0;
          em.stateTimer = 5.4 + idx;
          em.burstField.uniforms.uActive.value = 0; em.burstField.group.visible = false;
          setOrganismDepthLayer(em, false);
          membraneUniforms.uBreachWave.value[idx].set(10.0, 0.0, 0.0, 0.0);
        });
        stirEnergy = 0.7;
        if (!silent) {
          lastCustomNarration = null;
          const b = NARRATION_BEATS[NARRATION_BEATS.length - 1][uiLang];
          setNarration(b.line, b.note, true);
        }
      }

      shuffleBtnEl.addEventListener("click", shuffleLexiconCohort);
      eventBtnEl.addEventListener("click", () => triggerCatalystEvent(-1));
      resetBtnEl.addEventListener("click", () => resetAllSpecimens(false));

      // ==================== 10. 鼠标交互与轨道旋转 ====================
      const raycaster = new THREE.Raycaster(), pointerNdc = new THREE.Vector2();
      let isDragging = false, dragDist = 0, lastPx = 0, lastPy = 0, rotVelX = 0, rotVelY = 0, targetCamZ = PANORAMA_CAM_Z;

      function pickSpecimen() {
        raycaster.setFromCamera(pointerNdc, camera);
        const hits = raycaster.intersectObjects(embryoClickTargets, false);
        return hits.length ? hits[0].object.userData.specimenIndex : -1;
      }

      window.addEventListener("pointermove", (e) => {
        pointerNdc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
        if (!introComplete) return;
        if (isDragging) {
          const dx = e.clientX - lastPx, dy = e.clientY - lastPy;
          dragDist += Math.hypot(dx, dy);
          rotVelY = dx * 0.0048; rotVelX = dy * 0.0042;
          cellWorldGroup.rotation.y += rotVelY;
          cellWorldGroup.rotation.x = THREE.MathUtils.clamp(cellWorldGroup.rotation.x + rotVelX, -1.1, 1.1);
          lastPx = e.clientX; lastPy = e.clientY;
        } else {
          hoveredSpecimenIdx = pickSpecimen();
          sceneCanvas.style.cursor = hoveredSpecimenIdx >= 0 ? "pointer" : "grab";
        }
      });

      sceneCanvas.addEventListener("pointerdown", (e) => {
        if (!introComplete) return;
        pointerNdc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
        isDragging = true; dragDist = 0; lastPx = e.clientX; lastPy = e.clientY;
        heldSpecimenIdx = pickSpecimen();
      });

      window.addEventListener("pointerup", () => {
        if (!isDragging) return;
        isDragging = false;
        const wasHeld = heldSpecimenIdx; heldSpecimenIdx = -1;
        if (introComplete && dragDist < 7) {
          if (wasHeld >= 0) handleSpecimenClick(embryos[wasHeld]);
          else {
            raycaster.setFromCamera(pointerNdc, camera);
            const mHit = raycaster.intersectObject(membraneOuter, false);
            if (mHit.length) {
              membraneUniforms.uPokeDir.value.copy(cellWorldGroup.worldToLocal(mHit[0].point.clone()).normalize());
              membraneUniforms.uPokeWave.value.set(0.0, 0.85, 0.0, 0.0);
              stirEnergy = Math.min(1.0, stirEnergy + 0.35);
            }
          }
        }
      });

      window.addEventListener("wheel", (e) => { if (introComplete) targetCamZ = THREE.MathUtils.clamp(targetCamZ + e.deltaY * 0.0032, 6.2, 11.4); }, { passive: true });
      window.addEventListener("resize", () => { sdfJourney.resize(); resizeThreeScene(); });

      // ==================== 11. 极简无框 3D 词标与主循环 ====================
      const tempProj = new THREE.Vector3(), tempDest = new THREE.Vector3(), tempStream = new THREE.Vector3();
      const tempTintCol = new THREE.Color();

      function smoothstepJS(e0, e1, x) {
        const u = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
        return u * u * (3 - 2 * u);
      }
      function smootherstepJS(e0, e1, x) {
        const u = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
        return u * u * u * (u * (u * 6 - 15) + 10);
      }
      function evalQuadBezier(out, p0, p1, p2, u) {
        const iv = 1 - u;
        out.set(
          iv * iv * p0.x + 2 * iv * u * p1.x + u * u * p2.x,
          iv * iv * p0.y + 2 * iv * u * p1.y + u * u * p2.y,
          iv * iv * p0.z + 2 * iv * u * p1.z + u * u * p2.z
        );
      }

      function drawOverlayLabels(labelOpacity) {
        const w = window.innerWidth, h = window.innerHeight;
        overlayCtx.clearRect(0, 0, w, h);
        if (labelOpacity <= 0.02) return;

        overlayCtx.save();
        overlayCtx.textAlign = "center";
        overlayCtx.textBaseline = "middle";

        for (let i = 0; i < embryos.length; i++) {
          const em = embryos[i];
          if (!em.root.visible) continue;
          em.root.getWorldPosition(tempProj);
          tempProj.project(camera);
          em.screenX = (tempProj.x * 0.5 + 0.5) * w;
          em.screenY = (-tempProj.y * 0.5 + 0.5) * h;
          if (tempProj.z > 1) continue;

          const inNarrationZone = em.screenX < Math.min(620, w * 0.7) && em.screenY > h - 145;
          const zoneFade = inNarrationZone ? smoothstepJS(h - 95, h - 155, em.screenY) : 1.0;
          if (zoneFade <= 0.04) continue;

          const isEmerged = em.state === "emerged" || em.state === "emerging";
          const isFocus = i === hoveredSpecimenIdx || i === heldSpecimenIdx;
          const energyArc = Math.max(em.attention, em.usageEnergy);

          if (!isEmerged && energyArc > 0.08 && introComplete) {
            overlayCtx.shadowBlur = 0;
            overlayCtx.globalAlpha = labelOpacity * zoneFade * (0.35 + energyArc * 0.55);
            overlayCtx.beginPath();
            overlayCtx.arc(em.screenX, em.screenY, 26 + energyArc * 7, -Math.PI * 0.5, -Math.PI * 0.5 + Math.PI * 2 * energyArc);
            overlayCtx.strokeStyle = em.cfg.hexStr;
            overlayCtx.lineWidth = 1.25;
            overlayCtx.stroke();
          }

          const label = isEmerged
            ? `${em.cfg.word} · ${uiLang === "en" ? em.cfg.slangEn : em.cfg.slangZh}`
            : isFocus
              ? `${em.cfg.word} · ${uiLang === "en" ? em.cfg.rootEn : em.cfg.rootZh}`
              : em.cfg.word;

          overlayCtx.globalAlpha = labelOpacity * zoneFade * (isEmerged || isFocus ? 0.94 : 0.58);
          overlayCtx.font = isEmerged
            ? 'italic 15.5px "Instrument Serif", Georgia, serif'
            : '400 10.5px "IBM Plex Mono", monospace';
          overlayCtx.shadowColor = "rgba(8, 12, 22, 0.88)";
          overlayCtx.shadowBlur = 8;
          overlayCtx.fillStyle = isEmerged ? "#fde68a" : isFocus ? "#ffd4ec" : "rgba(226, 232, 240, 0.92)";
          overlayCtx.fillText(label, em.screenX, em.screenY + 34);
        }
        overlayCtx.restore();
      }

      resizeThreeScene();
      prewarmThreeShaders();
      resetAllSpecimens(true);
      syncControlLabels();
      updateIntroNarration(0);
      autoDiscoverAndLoadPods();

      let prevNow = performance.now() * 0.001;

      function animate() {
        requestAnimationFrame(animate);
        const t = performance.now() * 0.001;
        const dt = Math.min(0.033, Math.max(0.001, t - prevNow));
        prevNow = t;

        let uIntro = 1.0;

        if (!introComplete) {
          if (!introPaused) introElapsed = Math.min(INTRO_DURATION, introElapsed + dt);
          uIntro = introElapsed / INTRO_DURATION;
          hairlineFillEl.style.width = `${(uIntro * 100).toFixed(1)}%`;
          updateIntroNarration(uIntro);

          sdfJourney.render(t, uIntro, pointerNdc.x, pointerNdc.y);

          let camZ, camY, camFov, lookY;
          if (uIntro <= 0.74) {
            const pIn = Math.max(0, Math.min(1, (uIntro - 0.46) / 0.28));
            const easeIn = 1.0 - Math.pow(1.0 - pIn, 3.0);
            camZ = 2.35 - easeIn * 1.85;
            camY = 0.02 + easeIn * 0.03;
            camFov = 53.0 - easeIn * 4.5;
            lookY = 0.0;
          } else {
            const easeOut = smootherstepJS(0.74, 1.0, uIntro);
            camZ = 0.50 + easeOut * (PANORAMA_CAM_Z - 0.50);
            camY = 0.05 + easeOut * 0.01;
            camFov = 48.5 - easeOut * 6.5;
            lookY = easeOut * PANORAMA_LOOK_Y;
          }

          const parallaxFade = 1.0 - smoothstepJS(0.90, 1.0, uIntro);
          camera.position.set(pointerNdc.x * 0.09 * parallaxFade, camY + pointerNdc.y * 0.06 * parallaxFade, camZ);
          camera.lookAt(0, lookY, -1.8 * (1.0 - smootherstepJS(0.74, 0.92, uIntro)));
          camera.fov = camFov;
          camera.updateProjectionMatrix();

          membraneUniforms.uCamHole.value = uIntro < 0.74 ? 1.0 : (1.0 - smoothstepJS(2.90, 4.70, camZ));

          if (awakenEchoStage === 0 && uIntro > 0.67) {
            awakenEchoStage = 1;
            echoFilaments.spawnBurst(0, 6, embryos[0].cfg.color, embryos[0].cfg.accent);
            echoFilaments.spawnBurst(2, 6, embryos[2].cfg.color, embryos[2].cfg.accent);
          } else if (awakenEchoStage === 1 && uIntro > 0.72) {
            awakenEchoStage = 2;
            echoFilaments.spawnBurst(1, 5, embryos[1].cfg.color, embryos[1].cfg.accent);
            echoFilaments.spawnBurst(5, 5, embryos[5].cfg.color, embryos[5].cfg.accent);
          }

          if (!sealRippleFired && uIntro > 0.76 && camZ >= 4.55) {
            sealRippleFired = true;
            membraneUniforms.uPokeDir.value.set(0, 0, 1);
            membraneUniforms.uPokeWave.value.set(0.0, 0.88, 0.0, 0.0);
            stirEnergy = 0.72;
          }

          if (uIntro >= 1.0) {
            introComplete = true;
            membraneUniforms.uCamHole.value = 0.0;
            hairlineProgressEl.classList.add("is-done");
            syncControlLabels();
          }
        } else {
          membraneUniforms.uCamHole.value = 0.0;
          if (!isDragging) {
            cellWorldGroup.rotation.y += rotVelY + dt * 0.05;
            cellWorldGroup.rotation.x = THREE.MathUtils.clamp(cellWorldGroup.rotation.x + rotVelX, -1.1, 1.1);
            rotVelX *= Math.exp(-dt * 5.2);
            rotVelY *= Math.exp(-dt * 5.2);
          }
          camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetCamZ, dt * 5.5);
          camera.position.y = THREE.MathUtils.lerp(camera.position.y, 0.06, dt * 4.0);
          camera.lookAt(0, PANORAMA_LOOK_Y, 0);
        }

        const needThree = introComplete || uIntro > 0.46;
        if (needThree) {
          stirEnergy = Math.max(0, stirEnergy - dt * 0.42);

          if (introComplete) {
            autoCatalystCooldown -= dt;
            if (autoCatalystCooldown <= 0 && !catalystBeam.isActive()) {
              const waiting = embryos.filter((e) => e.state !== "emerged" && e.state !== "emerging");
              if (waiting.length) triggerCatalystEvent(waiting[Math.floor(Math.random() * waiting.length)].index);
              else autoCatalystCooldown = 14.0;
            }
          }

          catalystBeam.update(dt, t, (hitEm) => {
            hitEm.catalystFlash = 1.4;
            hitEm.usageEnergy = Math.min(1.0, Math.max(hitEm.usageEnergy + 0.68, 0.82));
            hitEm.attention = Math.max(hitEm.attention, 0.85);
            if (hitEm.state === "drifting" || hitEm.state === "receding") hitEm.state = "rising";
            hitEm.stateTimer = Math.max(hitEm.stateTimer, 5.0);
            membraneUniforms.uPokeDir.value.copy(hitEm.dir);
            membraneUniforms.uPokeWave.value.set(0.0, 1.0, 0.0, 0.0);
            echoFilaments.spawnBurst(hitEm.index, 12, hitEm.cfg.color, hitEm.cfg.accent);
            emitContagionWave(hitEm.pos, hitEm.cfg.color, 1.35);
            stirEnergy = Math.min(1.2, stirEnergy + 0.6);
            if (hitEm.usageEnergy >= 0.96 && hitEm.radius >= MEMBRANE_RADIUS - 0.5) triggerMembraneEmerge(hitEm);
          });

          if (contagionState.active) {
            contagionState.radius += dt * 3.1;
            contagionState.strength *= Math.exp(-dt * 1.45);
            chaosSporeUniforms.uContagionPos.value.copy(contagionState.origin);
            chaosSporeUniforms.uContagionRadius.value = contagionState.radius;
            chaosSporeUniforms.uContagionStrength.value = contagionState.strength;
            chaosSporeUniforms.uContagionColor.value.copy(contagionState.color);
            if (contagionState.strength < 0.015 || contagionState.radius > MEMBRANE_RADIUS * 2.4) {
              contagionState.active = false; chaosSporeUniforms.uContagionStrength.value = 0;
            }
          }

          echoFilaments.update(dt);

          membraneUniforms.uTime.value = t;
          for (let i = 0; i < ACTIVE_SLOTS; i++) {
            const bw = membraneUniforms.uBreachWave.value[i];
            if (bw.y > 0.005) { bw.x += dt; if (bw.x > 3.6) bw.y = 0; }
          }
          if (membraneUniforms.uPokeWave.value.y > 0.005) {
            membraneUniforms.uPokeWave.value.x += dt;
            if (membraneUniforms.uPokeWave.value.x > 2.8) membraneUniforms.uPokeWave.value.y = 0;
          }

          for (let i = 0; i < failingSparks.length; i++) {
            const fs = failingSparks[i];
            fs.cycle = (fs.cycle + dt * fs.speed) % 1.0;
            const maxY = Math.sqrt(Math.max(0.1, MEMBRANE_RADIUS * MEMBRANE_RADIUS * 0.84 - fs.horiz * fs.horiz));
            let y, op;
            if (fs.cycle < 0.42) {
              const p = fs.cycle / 0.42; y = -maxY * 0.72 + p * (maxY * 1.62); op = 0.14 + Math.sin(p * Math.PI) * 0.36;
            } else {
              const p = (fs.cycle - 0.42) / 0.58; y = maxY * 0.90 - p * p * (maxY * 1.68); op = (1.0 - p) * 0.24;
            }
            const a = fs.ang + t * 0.12;
            fs.mesh.position.set(Math.cos(a) * fs.horiz, y, Math.sin(a) * fs.horiz);
            fs.mat.opacity = op;
          }

          for (let i = 0; i < companionBlobs.length; i++) {
            const cb = companionBlobs[i];
            cb.uniforms.uTime.value = t;
            if (!introComplete) {
              const pGlide = smoothstepJS(cb.tEnter, cb.tEnter + 0.26, uIntro);
              if (pGlide <= 0.002) { cb.mesh.visible = false; continue; }
              cb.mesh.visible = true;
              evalQuadBezier(cb.mesh.position, cb.p0, cb.p1, cb.p2, pGlide);
              cb.mesh.position.x += Math.sin(t * 0.65 + cb.phase) * 0.05 * pGlide;
              cb.mesh.rotation.set(t * 0.45 + cb.phase, t * 0.6 + cb.phase, cb.phase);
              cb.mesh.scale.setScalar(cb.baseScale * (1.0 - pGlide * 0.28));
              cb.uniforms.uOpacity.value = smoothstepJS(0.0, 0.12, pGlide) * (1.0 - smoothstepJS(0.55, 1.0, pGlide) * 0.65);
            } else {
              cb.mesh.visible = true;
              cb.mesh.position.set(
                cb.p2.x + Math.sin(t * 0.42 + cb.phase) * 0.09,
                cb.p2.y + Math.cos(t * 0.36 + cb.phase) * 0.07,
                cb.p2.z + Math.sin(t * 0.38 + cb.phase * 1.3) * 0.09
              );
              cb.mesh.rotation.set(t * 0.25 + cb.phase, t * 0.35 + cb.phase, cb.phase);
              cb.mesh.scale.setScalar(cb.baseScale * 0.72);
              cb.uniforms.uOpacity.value = 0.34;
            }
          }

          for (let i = 0; i < dormantSeeds.length; i++) {
            const ds = dormantSeeds[i];
            ds.mesh.position.set(ds.basePos.x + Math.sin(t * 0.55 + ds.phase) * 0.08, ds.basePos.y + Math.cos(t * 0.48 + ds.phase) * 0.08, ds.basePos.z + Math.sin(t * 0.5 + ds.phase * 1.3) * 0.08);
          }

          let maxFocus = 0, focalIdx = -1;
          for (let i = 0; i < embryos.length; i++) {
            const em = embryos[i];
            const breath = Math.sin(t * 1.7 + em.phase);
            const isHeld = introComplete && heldSpecimenIdx === i && dragDist < 8;
            const isGazed = introComplete && (hoveredSpecimenIdx === i || isHeld);

            em.bodyUniforms.uTime.value = t + em.phase;
            em.bodyUniforms.uPulse.value = breath;
            em.catalystFlash = Math.max(0, em.catalystFlash - dt * 1.25);

            let targetMorph = 1.0, targetMeta = 0, targetMut = 0;
            let budIntroWeight = 1.0;

            if (!introComplete) {
              const pStream = smoothstepJS(em.tEnter, em.tEnter + 0.15, uIntro);
              if (pStream <= 0.002) {
                em.root.visible = false;
                membraneUniforms.uBulgeHeight.value[i] = 0;
                continue;
              }
              em.root.visible = true;
              evalQuadBezier(tempStream, em.streamP0, em.streamP1, em.cavityHome, pStream);

              const pMigrate = smootherstepJS(0.73, 0.97, uIntro);
              const destR = em.cfg.initialState === "pressing" ? MEMBRANE_RADIUS + 0.04 : em.cfg.initialState === "rising" ? MEMBRANE_RADIUS * 0.7 : MEMBRANE_RADIUS * (0.46 + i * 0.035);
              tempDest.copy(em.dir).multiplyScalar(destR);

              em.pos.copy(tempStream).lerp(tempDest, pMigrate);
              em.pos.y += Math.sin(t * 0.9 + em.phase) * 0.04 * (1 - pMigrate);
              em.radius = em.pos.length();

              targetMorph = smoothstepJS(0.66, 0.90, uIntro);
              em.root.scale.setScalar(0.56 + 0.44 * smoothstepJS(0.65, 0.91, uIntro));

              const initM = em.cfg.initialState === "pressing" ? 0.34 : em.cfg.initialState === "rising" ? 0.14 : 0.0;
              targetMut = initM * smoothstepJS(0.75, 0.98, uIntro);
              targetMeta = (em.cfg.initialState === "pressing" ? 0.26 : 0.08) * smoothstepJS(0.78, 0.98, uIntro);
              em.pushHeight = em.cfg.initialState === "pressing" ? smoothstepJS(0.84, 0.98, uIntro) * 0.52 : 0;
              em.strainIntensity = em.pushHeight * 1.05;
              budIntroWeight = pMigrate;
            } else {
              em.root.visible = true;
              em.root.scale.setScalar(THREE.MathUtils.lerp(em.root.scale.x, 1.0, dt * 4.0));
              targetMorph = 1.0;

              if (em.state !== "emerged" && em.state !== "emerging") {
                if (isGazed) {
                  if (em.state === "drifting" || em.state === "receding") em.state = "rising";
                  em.attention = Math.min(1.0, em.attention + dt * (isHeld ? 0.58 : 0.22));
                  em.usageEnergy = Math.min(1.0, em.usageEnergy + dt * (isHeld ? 0.42 : 0.14));
                  em.echoTimer -= dt;
                  if (em.echoTimer <= 0) { echoFilaments.spawnBurst(i, isHeld ? 5 : 3, em.cfg.color, em.cfg.accent); em.echoTimer = isHeld ? 0.36 : 0.64; }
                  if ((em.attention >= 1.0 || em.usageEnergy >= 1.0) && (em.state === "pressing" || em.radius >= MEMBRANE_RADIUS - 0.38)) triggerMembraneEmerge(em);
                } else {
                  em.attention = Math.max(0, em.attention - dt * 0.2);
                  if (em.usageEnergy >= 0.92 && em.state === "pressing") {
                    em.usageEnergy = Math.min(1.0, em.usageEnergy + dt * 0.18);
                    if (em.usageEnergy >= 0.99) triggerMembraneEmerge(em);
                  } else {
                    em.usageEnergy = Math.max(em.state === "pressing" ? 0.28 : 0, em.usageEnergy - dt * 0.055);
                  }
                  if (em.state === "pressing") {
                    em.echoTimer -= dt;
                    if (em.echoTimer <= 0) { echoFilaments.spawnBurst(i, 2, em.cfg.color, em.cfg.accent); em.echoTimer = 2.0 + Math.random() * 1.8; }
                  }
                }
              }

              const energy = Math.max(em.attention, em.usageEnergy);
              if (energy > maxFocus && em.state !== "emerged") { maxFocus = energy; focalIdx = i; }

              if (em.state === "drifting") {
                em.stateTimer -= dt;
                em.radius = THREE.MathUtils.lerp(em.radius, MEMBRANE_RADIUS * 0.48 + Math.sin(t * 0.75 + em.phase) * 0.18, dt * 1.4);
                em.pushHeight = THREE.MathUtils.lerp(em.pushHeight, 0, dt * 3.5);
                em.strainIntensity = THREE.MathUtils.lerp(em.strainIntensity, 0.1, dt * 2.5);
                targetMeta = em.usageEnergy * 0.25; targetMut = em.usageEnergy * 0.55; setOrganismDepthLayer(em, false);
                if (em.stateTimer <= 0) em.state = "rising";
              } else if (em.state === "rising") {
                em.radius = THREE.MathUtils.lerp(em.radius, MEMBRANE_RADIUS + 0.02, dt * (isGazed || em.usageEnergy > 0.55 ? 2.5 : 1.1));
                em.strainIntensity = THREE.MathUtils.lerp(em.strainIntensity, 0.42 + energy * 0.35, dt * 2.8);
                targetMeta = 0.12 + energy * 0.36; targetMut = Math.min(0.92, 0.16 + em.usageEnergy * 0.78); setOrganismDepthLayer(em, false);
                if (em.radius >= MEMBRANE_RADIUS - 0.24) { em.state = "pressing"; em.stateTimer = 5.6 + Math.random() * 2.4; }
              } else if (em.state === "pressing") {
                if (!isGazed && em.usageEnergy < 0.75) em.stateTimer -= dt;
                em.radius = THREE.MathUtils.lerp(em.radius, MEMBRANE_RADIUS + 0.05 + energy * 0.42 + breath * 0.09, dt * 3.4);
                const bulge = Math.max(0, (em.radius - (MEMBRANE_RADIUS - 0.42)) * 1.15);
                em.pushHeight = THREE.MathUtils.lerp(em.pushHeight, bulge, dt * 5.0);
                em.strainIntensity = THREE.MathUtils.lerp(em.strainIntensity, Math.min(1, bulge * 1.05), dt * 4.0);
                targetMeta = 0.24 + energy * 0.62; targetMut = Math.min(1, 0.28 + em.usageEnergy * 0.76); setOrganismDepthLayer(em, false);
                if (em.stateTimer <= 0 && energy < 0.34) {
                  em.state = "receding"; em.stateTimer = 2.6;
                  membraneUniforms.uPokeDir.value.copy(em.dir); membraneUniforms.uPokeWave.value.set(0.0, 0.55, 0.0, 0.0);
                }
              } else if (em.state === "receding") {
                em.stateTimer -= dt;
                em.radius = THREE.MathUtils.lerp(em.radius, MEMBRANE_RADIUS * 0.46, dt * 1.5);
                em.pushHeight = THREE.MathUtils.lerp(em.pushHeight, 0, dt * 4.5);
                em.strainIntensity = THREE.MathUtils.lerp(em.strainIntensity, 0.12, dt * 3.0); setOrganismDepthLayer(em, false);
                if (em.stateTimer <= 0 || em.radius < MEMBRANE_RADIUS * 0.54) { em.state = "drifting"; em.stateTimer = 3.2 + Math.random() * 3.2; }
              } else if (em.state === "emerging") {
                em.stateTimer += dt;
                em.radius = THREE.MathUtils.lerp(em.radius, MEMBRANE_RADIUS + 1.12, dt * 2.5);
                em.pushHeight = THREE.MathUtils.lerp(em.pushHeight, 0, dt * 4.8);
                targetMeta = targetMut = 1.0;
                if (em.radius > MEMBRANE_RADIUS + 0.15) setOrganismDepthLayer(em, true);
                if (em.stateTimer > 1.15) em.state = "emerged";
              } else if (em.state === "emerged") {
                em.radius = THREE.MathUtils.lerp(em.radius, MEMBRANE_RADIUS + 1.14 + Math.sin(t * 1.15 + em.phase) * 0.13, dt * 1.8);
                em.pushHeight = THREE.MathUtils.lerp(em.pushHeight, 0, dt * 3.5);
                targetMeta = targetMut = 1.0; setOrganismDepthLayer(em, true);
              }
              em.pos.copy(em.dir).multiplyScalar(em.radius);
            }

            em.morph = THREE.MathUtils.lerp(em.morph, targetMorph, dt * 3.2);
            em.metamorphosis = THREE.MathUtils.lerp(em.metamorphosis, targetMeta, dt * 3.2);
            em.mutation = THREE.MathUtils.lerp(em.mutation, targetMut, dt * 3.4);

            membraneUniforms.uBulgeDir.value[i].copy(em.dir);
            membraneUniforms.uBulgeHeight.value[i] = em.pushHeight;

            em.bodyUniforms.uMorph.value = em.morph;
            em.bodyUniforms.uStrain.value = em.strainIntensity;
            em.bodyUniforms.uMetamorphosis.value = em.metamorphosis;
            em.bodyUniforms.uMutation.value = em.mutation;
            em.bodyUniforms.uAttention.value = em.attention;
            em.bodyUniforms.uCatalystFlash.value = em.catalystFlash;
            em.root.position.copy(em.pos);

            if (!introComplete && em.morph < 0.85) {
              em.root.rotation.set(t * 0.55 + em.phase, t * 0.72 + em.phase, em.phase * 0.6);
            } else {
              em.root.lookAt(em.dir.clone().multiplyScalar(em.radius + 2.0));
            }

            if (em.hasCustomGlb) {
              // 过渡期仅留一层极轻薄的透明液膜，确保你的 .glb 模型在流进内腔时就清晰可见
              const shellFade = (1.0 - smoothstepJS(0.15, 0.58, em.morph)) * 0.28;
              em.bodyUniforms.uShellFade.value = shellFade;
              em.bodyMesh.visible = shellFade > 0.01;

              const glbPulseScale = (0.76 + 0.24 * smoothstepJS(0.0, 0.78, em.morph))
                * (1.0 + breath * 0.025 + em.attention * 0.09 + em.mutation * 0.08);
              em.customGlbSlot.visible = true;
              em.customGlbSlot.scale.setScalar(glbPulseScale);
              em.customGlbSlot.rotation.y = t * (0.28 + em.mutation * 0.45) + em.phase;
              em.customGlbSlot.rotation.x = Math.sin(t * 0.5 + em.phase) * 0.16;

              const glowBoost = em.attention * 0.35 + em.mutation * 0.28 + em.catalystFlash * 0.85;
              tempTintCol.copy(em.slangColor).lerp(em.accentColor, 0.5 + 0.5 * Math.sin(t * 1.8 + em.phase));
              for (let m = 0; m < em.glbMaterials.length; m++) {
                const mat = em.glbMaterials[m];
                if (mat.emissive && mat.userData.baseEmissive) {
                  mat.emissive.copy(mat.userData.baseEmissive).lerp(tempTintCol, Math.min(0.85, glowBoost));
                  mat.emissiveIntensity = mat.userData.baseEmissiveIntensity + glowBoost * 0.65;
                }
              }

              em.traitGroup.visible = false;
              em.coreGlyphSprite.visible = false;
              em.mutantCluster.visible = false;
            } else {
              em.bodyMesh.visible = true;
              em.bodyUniforms.uShellFade.value = 1.0;
              em.customGlbSlot.visible = false;
              em.coreGlyphSprite.visible = true;
              em.mutantCluster.visible = true;

              em.updateTrait(t, em.morph, em.mutation);
              const glyphVis = smoothstepJS(0.32, 0.92, em.morph);
              em.coreGlyphSprite.material.opacity = 0.88 * glyphVis;
              em.coreGlyphSprite.material.color.copy(em.pureColor).lerp(em.slangColor, Math.max(em.metamorphosis, em.mutation) * 0.72);
              em.coreGlyphSprite.scale.setScalar((0.28 + 0.14 * em.morph) + 0.05 * breath + em.attention * 0.05);

              const cGrow = Math.max(0, (em.mutation - 0.36) / 0.64);
              em.mutantCluster.scale.setScalar(THREE.MathUtils.lerp(em.mutantCluster.scale.x, cGrow > 0.01 ? 0.25 + cGrow * 0.92 : 0.001, dt * 4.5));
              em.mutantCluster.rotation.set(t * 0.45 + em.phase, -t * 0.58, t * 0.32);
              em.mutantCrystalMat.opacity = cGrow * 0.68;
            }

            const repLevel = em.state === "emerged" || em.state === "emerging" ? 1.0 : Math.max(em.usageEnergy, em.mutation) * budIntroWeight;
            for (let s = 0; s < em.budShards.length; s++) {
              const b = em.budShards[s];
              const tgtS = repLevel >= b.threshold ? 0.7 + (repLevel - b.threshold) * 0.65 : 0.0001;
              b.curScale = THREE.MathUtils.lerp(b.curScale, tgtS, dt * 4.8);
              b.mesh.scale.set(b.curScale * 0.72, b.curScale * 1.45, b.curScale * 0.72);
              b.mesh.visible = b.curScale > 0.02;
              if (b.mesh.visible) {
                const dr = b.distBase + repLevel * 0.14 + Math.sin(t * 1.4 + b.seed) * 0.05;
                b.mesh.position.copy(b.dirVec).multiplyScalar(dr);
                b.mesh.position.x += Math.sin(t * 1.05 + b.seed * 1.3) * 0.045;
                b.mesh.position.y += Math.cos(t * 1.15 + b.seed * 0.9) * 0.045;
                b.mesh.rotation.y += dt * 1.4;
                b.mat.color.copy(em.pureColor).lerp(s % 2 === 0 ? em.slangColor : em.accentColor, Math.min(1, em.mutation * 1.25));
              }
            }
            if (em.burstField.group.visible) em.burstField.uniforms.uTime.value = t;
          }

          chaosSporeUniforms.uTime.value = t;
          chaosSporeUniforms.uStir.value = stirEnergy;
          if (focalIdx >= 0 && maxFocus > 0.08) {
            chaosSporeUniforms.uFocusPos.value.copy(embryos[focalIdx].pos);
            chaosSporeUniforms.uFocusStrength.value = THREE.MathUtils.lerp(chaosSporeUniforms.uFocusStrength.value, maxFocus, dt * 5.0);
            chaosSporeUniforms.uFocusColor.value.copy(embryos[focalIdx].slangColor);
          } else {
            chaosSporeUniforms.uFocusStrength.value = THREE.MathUtils.lerp(chaosSporeUniforms.uFocusStrength.value, 0, dt * 4.0);
          }

          renderer.render(scene, camera);
        }

        drawOverlayLabels(introComplete ? 1.0 : smoothstepJS(0.90, 0.99, uIntro));
      }

      animate();
    </script>
  </body>
</html>
