    <style>
      :root {
        color-scheme: dark;
        --font-serif: "Instrument Serif", Georgia, "Songti SC", serif;
        --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        --font-mono: "IBM Plex Mono", Consolas, monospace;
      }

      * { box-sizing: border-box; }

      html, body, .app-shell {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #161d2b;
        font-family: var(--font-sans);
        color: rgba(244, 247, 252, 0.94);
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      /* 暗夜逆光暮色基底 */
      .app-shell::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(ellipse 68% 42% at 50% 40%, rgba(140, 122, 126, 0.28), transparent 68%),
          radial-gradient(circle at 24% 58%, rgba(196, 114, 72, 0.12), transparent 52%),
          radial-gradient(circle at 76% 28%, rgba(92, 126, 178, 0.16), transparent 54%),
          linear-gradient(180deg, #1b2439 0%, #2f3344 46%, #141a28 74%, #0a0e17 100%);
        pointer-events: none;
      }

      #scene, #sdfCanvas, #overlayCanvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #scene { z-index: 2; cursor: grab; touch-action: none; }
      #scene:active { cursor: grabbing; }
      #sdfCanvas { z-index: 3; pointer-events: none; }
      #overlayCanvas { z-index: 4; pointer-events: none; }

      /* 无边缘底部暗色渐变晕影 */
      .bottom-scrim {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 27vh;
        z-index: 6;
        pointer-events: none;
        background: linear-gradient(
          to top,
          rgba(9, 13, 22, 0.88) 0%,
          rgba(9, 13, 22, 0.52) 42%,
          rgba(9, 13, 22, 0.0) 100%
        );
      }

      /* 左下角无框旁白区 */
      .narration-stage {
        position: fixed;
        z-index: 10;
        left: clamp(28px, 4.2vw, 64px);
        bottom: clamp(26px, 4.2vh, 48px);
        width: min(560px, 60vw);
        text-align: left;
        pointer-events: none;
        transition: opacity 480ms ease, transform 480ms ease;
      }
      .narration-stage.is-fading {
        opacity: 0;
        transform: translateY(6px);
      }
      .narration-line {
        margin: 0;
        font-family: var(--font-serif);
        font-style: italic;
        font-size: clamp(21px, 2.05vw, 30px);
        font-weight: 400;
        line-height: 1.24;
        letter-spacing: 0.01em;
        color: rgba(248, 250, 252, 0.96);
        text-shadow: 0 2px 16px rgba(6, 10, 18, 0.72);
      }
      html[lang="zh-CN"] .narration-line {
        font-family: var(--font-sans);
        font-style: normal;
        font-size: clamp(15.5px, 1.38vw, 19.5px);
        font-weight: 400;
        letter-spacing: 0.04em;
        line-height: 1.6;
      }
      .narration-note {
        margin: 8px 0 0;
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        color: rgba(203, 213, 225, 0.64);
        line-height: 1.45;
      }
      .narration-note:empty {
        display: none;
      }

      /* 右下角极轻无框控制栏 */
      .whisper-controls {
        position: fixed;
        z-index: 11;
        right: clamp(26px, 4vw, 58px);
        bottom: clamp(28px, 4.3vh, 50px);
        display: inline-flex;
        align-items: center;
        gap: 10px;
        opacity: 0.52;
        transition: opacity 220ms ease;
      }
      .whisper-controls:hover,
      .whisper-controls.needs-sync {
        opacity: 0.96;
      }
      .whisper-btn {
        border: 0;
        background: transparent;
        padding: 2px 0;
        color: rgba(226, 232, 240, 0.9);
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        transition: color 160ms ease;
      }
      .whisper-btn:hover {
        color: #f472b6;
      }
      .whisper-btn.is-accent {
        color: #f472b6;
      }
      .whisper-btn.is-hidden,
      .whisper-sep.is-hidden {
        display: none;
      }
      .whisper-sep {
        color: rgba(226, 232, 240, 0.24);
        font-size: 10px;
        pointer-events: none;
      }

      /* 贴底 1.5px 历程光丝 */
      .hairline-progress {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        height: 1.5px;
        background: rgba(255, 255, 255, 0.07);
        pointer-events: none;
        transition: opacity 600ms ease;
      }
      .hairline-progress.is-done {
        opacity: 0;
      }
      .hairline-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #7dd3fc, #f472b6, #fdba74);
      }

      @media (max-width: 820px) {
        .narration-stage {
          width: calc(100vw - 44px);
          left: 22px;
          bottom: 58px;
        }
        .whisper-controls {
          right: 22px;
          bottom: 20px;
          flex-wrap: wrap;
          justify-content: flex-end;
        }
      }
    </style>

      // ==================== 2. 细胞内部微观 WebGL2 SDF 引擎（恒速自转，无结尾抽搐） ====================
      function initInternalSdfEngine() {
        const gl = sdfCanvas.getContext("webgl2", { alpha: true, premultipliedAlpha: false, antialias: false, powerPreference: "high-performance" });
        if (!gl) return { resize() {}, render() {} };

        const vs = `#version 300 es
          in vec2 p;
          void main() { gl_Position = vec4(p, 0.0, 1.0); }
        `;

        const fs = `#version 300 es
          precision highp float;
          out vec4 O;
          uniform vec2 uRes;
          uniform float uTime;
          uniform float uProgress;
          uniform vec2 uMouse;

          const float TAU = 6.2831853;

          mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
          float hash12(vec2 p) {
            vec3 p3 = fract(vec3(p.xyx) * 0.1031);
            p3 += dot(p3, p3.yzx + 33.33);
            return fract((p3.x + p3.y) * p3.z);
          }
          float vnoise(vec2 p) {
            vec2 i = floor(p), f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            return mix(
              mix(hash12(i), hash12(i + vec2(1.0, 0.0)), f.x),
              mix(hash12(i + vec2(0.0, 1.0)), hash12(i + vec2(1.0, 1.0)), f.x),
              f.y
            );
          }
          float fbm2(vec2 p) {
            float v = 0.0, a = 0.5;
            for (int i = 0; i < 3; i++) { v += a * vnoise(p); p = p * 2.03 + vec2(1.9, 7.3); a *= 0.5; }
            return v;
          }
          float smin(float a, float b, float k) {
            float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
            return mix(b, a, h) - k * h * (1.0 - h);
          }
          vec3 opalIridescence(float cosTheta, float phase) {
            return 0.5 + 0.5 * cos(TAU * ((1.0 - cosTheta) * 1.15 + phase + vec3(0.00, 0.33, 0.67)));
          }
          vec3 bioGlassTint(float ph) {
            float k = fract(ph * 0.137);
            vec3 c1 = vec3(0.08, 0.16, 0.30);
            vec3 c2 = vec3(0.20, 0.09, 0.17);
            vec3 c3 = vec3(0.07, 0.21, 0.19);
            vec3 c4 = vec3(0.15, 0.12, 0.24);
            return k < 0.25 ? mix(c1, c2, k * 4.0)
                 : k < 0.50 ? mix(c2, c3, (k - 0.25) * 4.0)
                 : k < 0.75 ? mix(c3, c4, (k - 0.50) * 4.0)
                 : mix(c4, c1, (k - 0.75) * 4.0);
          }

          const float Z_BEND_START = 24.0;
          const float Z_ATRIUM     = 136.0;

          vec3 tunnelOffset(float z) {
            float envIn  = smoothstep(Z_BEND_START, Z_BEND_START + 28.0, z);
            float envOut = 1.0 - smoothstep(Z_ATRIUM - 36.0, Z_ATRIUM - 6.0, z);
            float dz = max(0.0, z - Z_BEND_START);
            return vec3(sin(dz * 0.034) * 7.4, sin(dz * 0.045) * 5.0, 0.0) * (envIn * envOut);
          }

          float sdMatrixDoubleBlob(vec3 localP, float worldZ, float mWarp, out float outPh) {
            float exitScale = 1.0 - smoothstep(Z_ATRIUM - 24.0, Z_ATRIUM - 4.0, worldZ);
            if (exitScale <= 0.01) { outPh = 0.0; return 100.0; }

            vec3 rp = localP + vec3(2.0, 2.0, 0.0);
            vec3 cell = vec3(4.0);
            vec3 id = round(rp / cell);
            vec3 q = rp - cell * id;

            float ph = dot(id, vec3(1.7, 3.3, 2.1));
            vec3 jitter = vec3(
              sin(ph * 1.31 + uTime * 0.55),
              cos(ph * 1.73 - uTime * 0.48),
              sin(ph * 2.17 + uTime * 0.42)
            ) * (0.34 * mWarp);
            q -= jitter;

            float rad = (0.48 + 0.17 * sin(uTime * 0.85 + ph)) * (1.0 + 0.08 * sin(uTime * 0.45 + ph * 0.3)) * exitScale;

            q.xz *= rot(uTime * 0.18 + mWarp * 0.45 + ph * 0.4);
            float sph = length(q) - rad;

            vec3 oq = q;
            oq.xy *= rot(ph + uTime * 0.28 + mWarp * 0.65);
            vec3 off = vec3((0.48 + 0.14 * sin(uTime * 0.45 + ph)) * exitScale, 0.0, 0.0);
            float sph2 = length(oq - off) - rad * 0.62;

            outPh = ph;
            return smin(sph, sph2, 0.35 * exitScale);
          }

          float gMatBlend = 0.0;
          float gPhase = 0.0;
          vec2  gWallUv = vec2(0.0);

          float mapInternal(vec3 pos, float mWarp) {
            vec3 localP = pos - tunnelOffset(pos.z);

            float phM = 0.0;
            float dMatrix = sdMatrixDoubleBlob(localP, pos.z, mWarp, phM);

            float dWall = 100.0;
            vec2 wallUv = vec2(0.0);
            if (mWarp > 0.015) {
              float baseR = mix(28.0, 6.2, smoothstep(0.0, 0.88, mWarp));
              float atriumFlare = pow(smoothstep(Z_ATRIUM - 26.0, Z_ATRIUM + 2.0, pos.z), 1.85) * 20.0;
              float wave = sin(localP.z * 0.42 + uTime * 1.45) * 0.5 + 0.5;
              float pulsate = 1.25 - wave * wave * 1.25;
              wallUv = vec2(atan(localP.x, localP.y) / 3.1415926, localP.z * 0.055);
              float disp = fbm2(wallUv * 4.5 + vec2(0.0, uTime * 0.14)) * 0.32;
              dWall = (baseR + atriumFlare + pulsate) - length(localP.xy) - disp;
              float pastAtrium = pos.z - Z_ATRIUM;
              if (pastAtrium > 0.0) dWall = max(dWall, pastAtrium);
            }

            gPhase = phM;
            gWallUv = wallUv;
            if (mWarp <= 0.015) { gMatBlend = 0.0; return dMatrix; }

            float fuseK = mix(1.35, 0.72, mWarp);
            float dOut = smin(dWall, dMatrix, fuseK);
            gMatBlend = smoothstep(-0.32, 0.32, dMatrix - dWall);
            return dOut;
          }

          vec3 calcNormal(vec3 p, float mWarp) {
            vec2 e = vec2(0.014, 0.0);
            return normalize(vec3(
              mapInternal(p + e.xyy, mWarp) - mapInternal(p - e.xyy, mWarp),
              mapInternal(p + e.yxy, mWarp) - mapInternal(p - e.yxy, mWarp),
              mapInternal(p + e.yyx, mWarp) - mapInternal(p - e.yyx, mWarp)
            ));
          }

          void main() {
            vec2 uv = gl_FragCoord.xy / uRes;
            vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;

            float s = clamp(uProgress / 0.66, 0.0, 1.0);
            float mWarp = smoothstep(0.35, 0.60, s);
            float flowWindow = smoothstep(0.38, 0.54, s) * (1.0 - smoothstep(0.84, 0.98, s));

            float zCam = 38.0 * s + 101.0 * pow(smoothstep(0.20, 0.98, s), 1.82);
            float exitEnvelope = 1.0 - smoothstep(Z_ATRIUM - 12.0, Z_ATRIUM + 1.5, zCam);
            if (exitEnvelope <= 0.002) { O = vec4(0.0); return; }

            vec3 ro = vec3(0.0, 0.0, zCam) + tunnelOffset(zCam);
            float lookAheadZ = zCam + 20.0;
            float mouseDamp = 1.0 - smoothstep(0.74, 0.96, s);
            vec3 ta = vec3(uMouse.x * 1.2 * mouseDamp, uMouse.y * 0.9 * mouseDamp, lookAheadZ) + tunnelOffset(lookAheadZ);

            vec3 fw = normalize(ta - ro);
            vec3 rt = normalize(cross(vec3(0.0, 1.0, 0.0), fw));
            vec3 up = cross(fw, rt);

            float gentleRoll = sin(uTime * 0.20) * 0.055 * (1.0 - mWarp);
            vec2 pr = rot(gentleRoll) * p;
            vec3 rd = normalize(fw * mix(1.52, 1.38, flowWindow) + rt * pr.x + up * pr.y);

            vec3 skyZenith  = vec3(0.032, 0.048, 0.095);
            vec3 skyHorizon = vec3(0.155, 0.132, 0.142);
            vec3 abyssDeep  = vec3(0.014, 0.019, 0.036);
            vec3 bg = mix(abyssDeep, skyHorizon, smoothstep(0.0, 0.52, uv.y));
            bg = mix(bg, skyZenith, smoothstep(0.48, 1.0, uv.y));
            bg += vec3(0.11, 0.068, 0.052) * exp(-dot(p - vec2(0.0, 0.04), p - vec2(0.0, 0.04)) * 2.2) * 0.55;

            float t = mix(1.1, 0.16, mWarp);
            float tMax = mix(32.0, 74.0, mWarp);
            float glow = 0.0;
            bool hit = false;
            bool enteredAtrium = false;
            vec3 pos = ro;

            for (int i = 0; i < 68; i++) {
              pos = ro + rd * t;
              if (mWarp > 0.72 && pos.z > Z_ATRIUM + 0.6) { enteredAtrium = true; break; }
              float d = mapInternal(pos, mWarp);
              glow += (0.009 / (0.036 + d * d)) * (1.0 - mWarp * 0.68);
              if (d < 0.008) { hit = true; break; }
              if (t > tMax) break;
              t += d * mix(0.60, 0.76, mWarp);
            }

            vec3 col = bg;
            float outAlpha = 1.0;

            if (hit) {
              vec3 n = calcNormal(pos, mWarp);
              vec3 v = -rd;
              vec3 l1 = normalize(vec3(-0.36, 0.80, -0.48));
              vec3 rimL = normalize(vec3(0.08, 0.88, 0.46));

              float cosNV = clamp(dot(n, v), 0.0, 1.0);
              float fres = pow(1.0 - cosNV, 3.2);
              float underGlow = pow(1.0 - smoothstep(-0.60, 0.22, n.y), 1.5);
              float wrapDif = clamp((dot(n, l1) + 0.36) / 1.36, 0.0, 1.0);
              float spec = pow(clamp(dot(n, normalize(l1 + v)), 0.0, 1.0), 116.0);
              float coat = pow(clamp(dot(n, normalize(rimL + v)), 0.0, 1.0), 140.0) * clamp(n.y * 0.7 + 0.3, 0.0, 1.0);

              vec3 smokedBase = bioGlassTint(gPhase);
              vec3 opal = opalIridescence(cosNV, 0.18 + gPhase * 0.07 + uTime * 0.02);
              vec3 podBioGlow = mix(vec3(1.05, 0.44, 0.14), vec3(0.92, 0.28, 0.54), fract(gPhase * 0.31));
              vec3 podLit = smokedBase * (0.24 + 0.88 * wrapDif)
                          + podBioGlow * (0.58 * underGlow + 0.10)
                          + mix(smokedBase * 1.4, opal * 0.65, 0.55) * fres * 0.72
                          + vec3(0.94, 0.88, 0.82) * (spec * 1.05 + coat * 0.55);

              float veins = fbm2(gWallUv * 6.0 + vec2(0.0, uTime * 0.22));
              float pulseBand = pow(0.5 + 0.5 * sin(pos.z * 0.48 + uTime * 1.9 + veins * 2.2), 3.2);
              float atriumRim = smoothstep(Z_ATRIUM - 22.0, Z_ATRIUM, pos.z);
              vec3 wallBase = mix(vec3(0.032, 0.044, 0.088), vec3(0.115, 0.138, 0.215), veins);
              vec3 veinGlow = mix(vec3(0.88, 0.38, 0.16), vec3(0.82, 0.30, 0.58), veins);
              vec3 wallLit = wallBase * (0.38 + 0.68 * fres)
                           + veinGlow * (pow(veins, 2.2) * 0.52 + pulseBand * 0.26)
                           + mix(vec3(0.45, 0.68, 0.86), vec3(0.95, 0.58, 0.34), fres) * atriumRim * (0.38 + fres * 0.55);

              vec3 lit = mix(podLit, wallLit, gMatBlend);
              vec3 hazeCol = mix(bg, vec3(0.145, 0.135, 0.175), 0.45 * mWarp);
              float fogRate = mix(0.056, 0.021, mWarp);
              col = mix(lit, hazeCol, 1.0 - exp(-t * fogRate));

              outAlpha = (1.0 - smoothstep(Z_ATRIUM - 6.0, Z_ATRIUM + 0.5, pos.z) * 0.82 * gMatBlend) * exitEnvelope;
            } else if (enteredAtrium) {
              float distToAtrium = max(0.0, Z_ATRIUM - ro.z);
              float approach = 1.0 - smoothstep(4.0, 54.0, distToAtrium);
              float centerClear = 1.0 - smoothstep(0.04, 0.72, length(p));
              col = mix(bg, vec3(0.16, 0.145, 0.185), 0.52);
              outAlpha = clamp((1.0 - approach) * (0.86 - centerClear * 0.58), 0.0, 0.86) * exitEnvelope;
            } else {
              outAlpha = exitEnvelope;
            }

            vec3 glowCol = mix(vec3(0.96, 0.46, 0.18), vec3(0.68, 0.36, 0.82), 0.5 + 0.5 * sin(uTime * 0.28));
            col += glowCol * glow * 0.042 * outAlpha;

            col *= 1.0 - 0.14 * dot(p, p);
            vec3 mapped = (col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14);
            float luma = dot(mapped, vec3(0.299, 0.587, 0.114));
            mapped = mix(vec3(luma), mapped, 1.18);
            col = pow(clamp(mapped, 0.0, 1.0), vec3(0.4545));
            col += (hash12(gl_FragCoord.xy + uTime) - 0.5) * (2.0 / 255.0);

            O = vec4(col, clamp(outAlpha, 0.0, 1.0));
          }
        `;

        const prog = gl.createProgram();
        for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
          const sh = gl.createShader(type);
          gl.shaderSource(sh, src);
          gl.compileShader(sh);
          if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) console.error("SDF shader error:", gl.getShaderInfoLog(sh));
          gl.attachShader(prog, sh);
        }
        gl.linkProgram(prog);

        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

        const loc = {
          p: gl.getAttribLocation(prog, "p"),
          uRes: gl.getUniformLocation(prog, "uRes"),
          uTime: gl.getUniformLocation(prog, "uTime"),
          uProgress: gl.getUniformLocation(prog, "uProgress"),
          uMouse: gl.getUniformLocation(prog, "uMouse")
        };

        let w = 2, h = 2;
        function resize() {
          const scale = 0.62;
          w = Math.max(2, Math.floor(window.innerWidth * scale));
          h = Math.max(2, Math.floor(window.innerHeight * scale));
          sdfCanvas.width = w;
          sdfCanvas.height = h;
        }
        function render(tSec, progress, mx, my) {
          if (progress >= 0.67) {
            if (sdfCanvas.style.display !== "none") sdfCanvas.style.display = "none";
            return;
          }
          if (sdfCanvas.style.display === "none") sdfCanvas.style.display = "block";
          gl.viewport(0, 0, w, h);
          gl.clearColor(0, 0, 0, 0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.useProgram(prog);
          gl.bindBuffer(gl.ARRAY_BUFFER, buf);
          gl.enableVertexAttribArray(loc.p);
          gl.vertexAttribPointer(loc.p, 2, gl.FLOAT, false, 0, 0);
          gl.uniform2f(loc.uRes, w, h);
          gl.uniform1f(loc.uTime, tSec);
          gl.uniform1f(loc.uProgress, progress);
          gl.uniform2f(loc.uMouse, mx, my);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }
        resize();
        return { resize, render };
      }

      const sdfJourney = initInternalSdfEngine();

      // ==================== 3. Three.js 暗夜生物雕塑空间 + 程序化 HDRI 环境反射 ====================
      const renderer = new THREE.WebGLRenderer({ canvas: sceneCanvas, alpha: true, antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6));
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.06, 70);
      camera.position.set(0, 0.02, 2.35);

      (function buildNocturnalStudioEnvMap() {
        const pmrem = new THREE.PMREMGenerator(renderer);
        const envScene = new THREE.Scene();
        const domeGeo = new THREE.SphereGeometry(12, 24, 16);
        const domeMat = new THREE.ShaderMaterial({
          side: THREE.BackSide,
          vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
          fragmentShader: `
            varying vec3 vDir;
            void main() {
              vec3 d = normalize(vDir);
              vec3 zenith = vec3(0.22, 0.30, 0.50);
              vec3 horizon = vec3(0.56, 0.48, 0.54);
              vec3 nadir = vec3(0.76, 0.34, 0.14);
              vec3 col = d.y >= 0.0
                ? mix(horizon, zenith, pow(d.y, 0.6))
                : mix(horizon * 0.55, nadir, pow(-d.y, 0.55));
              float keySpot = pow(max(dot(d, normalize(vec3(-0.36, 0.78, 0.50))), 0.0), 16.0);
              float rimSpot = pow(max(dot(d, normalize(vec3(0.65, 0.32, -0.68))), 0.0), 10.0);
              col += vec3(1.55, 1.38, 1.24) * keySpot + vec3(0.95, 0.55, 0.86) * rimSpot;
              gl_FragColor = vec4(col, 1.0);
            }
          `
        });
        const dome = new THREE.Mesh(domeGeo, domeMat);
        envScene.add(dome);
        const envRT = pmrem.fromScene(envScene, 0.04);
        scene.environment = envRT.texture;
        domeGeo.dispose();
        domeMat.dispose();
        pmrem.dispose();
      })();

      const cellWorldGroup = new THREE.Group();
      scene.add(cellWorldGroup);

      scene.add(new THREE.AmbientLight(0x8ea2c8, 1.05));
      const keyLight = new THREE.DirectionalLight(0xf8efe6, 1.65);
      keyLight.position.set(-3.6, 8.0, 5.2);
      scene.add(keyLight);
      const frontFill = new THREE.DirectionalLight(0xd8e4ff, 0.75);
      frontFill.position.set(1.8, 1.6, 7.5);
      scene.add(frontFill);
      const rimLight = new THREE.DirectionalLight(0x94b2e8, 0.95);
      rimLight.position.set(4.5, 4.2, -5.8);
      scene.add(rimLight);
      const warmUnderLight = new THREE.PointLight(0xf08c3a, 2.0, 11.0);
      warmUnderLight.position.set(0, -2.2, 0.8);
      scene.add(warmUnderLight);

      function resizeThreeScene() {
        const w = window.innerWidth, h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h, false);
        const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
        overlayCanvas.width = Math.floor(w * dpr);
        overlayCanvas.height = Math.floor(h * dpr);
        overlayCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      // ==================== 4. 巨型 3D 暗夜烟熏蛋白石活体细胞膜 ====================
      const membraneUniforms = {
        uTime: { value: 0 },
        uRadius: { value: MEMBRANE_RADIUS },
        uCamHole: { value: 0.0 },
        uBulgeDir: { value: SLOT_LAYOUTS.map((s) => s.homeDir.clone()) },
        uBulgeHeight: { value: [0, 0, 0, 0, 0, 0] },
        uBreachDir: { value: SLOT_LAYOUTS.map((s) => s.homeDir.clone()) },
        uBreachWave: { value: SLOT_LAYOUTS.map(() => new THREE.Vector4(10.0, 0.0, 0.0, 0.0)) },
        uPokeDir: { value: new THREE.Vector3(0, 0, 1) },
        uPokeWave: { value: new THREE.Vector4(10.0, 0.0, 0.0, 0.0) }
      };

      const membraneVertexShader = `
        uniform float uTime, uRadius, uCamHole;
        uniform vec3 uBulgeDir[6], uBreachDir[6], uPokeDir;
        uniform float uBulgeHeight[6];
        uniform vec4 uBreachWave[6], uPokeWave;
        varying vec3 vNormal, vViewDir, vDir, vWorldPos;
        varying float vStrain, vHole;

        void main() {
          vec3 dir = normalize(position);
          float disp = sin(uTime * 1.05 + dir.y * 2.5 + dir.x * 1.9) * 0.026;
          float strain = 0.0, hole = 0.0;

          if (uCamHole > 0.004) {
            float angCam = acos(clamp(dir.z, -1.0, 1.0));
            float rCam = 0.08 + 0.44 * uCamHole;
            float camAp = (1.0 - smoothstep(rCam * 0.36, rCam, angCam)) * smoothstep(0.0, 0.2, uCamHole);
            hole = max(hole, camAp);
            disp += exp(-angCam * angCam * 4.2) * uCamHole * 0.24;
            strain = max(strain, camAp * 0.9);
          }

          for (int i = 0; i < 6; i++) {
            float bh = uBulgeHeight[i];
            if (bh > 0.002) {
              float ang = acos(clamp(dot(dir, normalize(uBulgeDir[i])), -1.0, 1.0));
              float dome = exp(-ang * ang * 9.5) * bh;
              disp += dome * 0.62;
              strain = max(strain, clamp(dome * 1.55, 0.0, 1.0));
            }
            float bwActive = uBreachWave[i].y;
            if (bwActive > 0.01) {
              float age = uBreachWave[i].x;
              float angB = acos(clamp(dot(dir, normalize(uBreachDir[i])), -1.0, 1.0));
              float openEnv = sin(clamp(age / 1.85, 0.0, 1.0) * 3.14159) * bwActive;
              float rOpen = 0.06 + 0.28 * openEnv;
              float aperture = (1.0 - smoothstep(rOpen * 0.28, rOpen, angB)) * openEnv;
              hole = max(hole, aperture);
              disp += sin(angB * 14.0 - age * 10.5) * exp(-angB * 2.4) * exp(-age * 1.5) * bwActive * 0.14;
              strain = max(strain, aperture * 0.95);
            }
          }

          if (uPokeWave.y > 0.01) {
            float ageP = uPokeWave.x;
            float angP = acos(clamp(dot(dir, normalize(uPokeDir)), -1.0, 1.0));
            disp += sin(angP * 15.0 - ageP * 10.0) * exp(-angP * 2.4) * exp(-ageP * 1.6) * uPokeWave.y * 0.15;
          }

          vec3 displaced = dir * (uRadius + disp);
          vec4 wp = modelMatrix * vec4(displaced, 1.0);
          vWorldPos = wp.xyz;
          vDir = dir;
          vNormal = normalize(mat3(modelMatrix) * normalize(dir + vec3(0.0, disp * 0.08, 0.0)));
          vViewDir = normalize(cameraPosition - wp.xyz);
          vStrain = clamp(strain, 0.0, 1.0);
          vHole = clamp(hole, 0.0, 1.0);
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `;

      const membraneOuterFragShader = `
        uniform float uTime;
        varying vec3 vNormal, vViewDir, vDir, vWorldPos;
        varying float vStrain, vHole;

        vec3 hash33(vec3 p) { p = fract(p * vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yxz + 33.33); return fract((p.xxy + p.yxx) * p.zyx); }
        vec2 cellVoronoi(vec3 p) {
          vec3 i = floor(p), f = fract(p); float d1 = 8.0, d2 = 8.0;
          for (int x = -1; x <= 1; x++) for (int y = -1; y <= 1; y++) for (int z = -1; z <= 1; z++) {
            vec3 g = vec3(float(x), float(y), float(z));
            vec3 o = 0.5 + 0.38 * sin(uTime * 0.65 + 6.2831 * hash33(i + g));
            vec3 r = g + o - f; float d = dot(r, r);
            if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) { d2 = d; }
          }

            if (traitRefs.dropCore) traitRefs.dropCore.material.opacity = 0.70 * mVis;
            if (traitRefs.mirage) { traitRefs.mirage.material.opacity = 0.16 * mVis; traitRefs.mirage.position.set(Math.sin(t * 1.6) * (0.07 + mut * 0.06), Math.cos(t * 1.3) * 0.06, Math.sin(t * 1.1) * 0.05); }
            if (traitRefs.cubeCore) { traitRefs.cubeCore.material.opacity = 0.66 * mVis; const st = Math.floor(t * 2.2) * 0.45 + Math.pow((t * 2.2) % 1, 4.0) * 0.45; traitRefs.cubeCore.rotation.set(st * 0.7, st, st * 0.4); }
            if (traitRefs.beads) {
              traitRefs.beads[0].material.opacity = 0.68 * mVis;
              traitRefs.beads[0].position.y = Math.sin(t * 1.7) * 0.04;
              traitRefs.beads[1].position.y = -Math.sin(t * 1.7) * 0.04;
            }
          }
        };
        return em;
      }

      for (let i = 0; i < ACTIVE_SLOTS; i++) {
        embryos.push(createLexicalSeedPod(getSpecimenConfig(i), i));
      }

      // ==================== 6.5 自动目录检索 + IndexedDB 持久记忆（与 index.html 同机制，无需 bundle.js） ====================
      const gltfLoader = new GLTFLoader();
      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.166.0/examples/jsm/libs/draco/gltf/");
      gltfLoader.setDRACOLoader(dracoLoader);

      // 动态挂接 MeshoptDecoder，兼容 Blender/Houdini 各类压缩导出
      import("three/addons/libs/meshopt_decoder.module.js")
        .then((mod) => { if (mod && mod.MeshoptDecoder) gltfLoader.setMeshoptDecoder(mod.MeshoptDecoder); })
        .catch(() => {});

      const POD_DB_NAME = "PrimordialLexiconPods_V2";

      function openPodDB() {
        return new Promise((resolve) => {
          if (!window.indexedDB) { resolve(null); return; }
          const req = window.indexedDB.open(POD_DB_NAME, 1);
          req.onupgradeneeded = (ev) => {
            const db = ev.target.result;
            if (!db.objectStoreNames.contains("pods")) db.createObjectStore("pods", { keyPath: "slot" });
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        });
      }

      async function savePodToDB(slot, name, buf) {
        try {
          const db = await openPodDB();
          if (!db) return;
          const tx = db.transaction("pods", "readwrite");
          tx.objectStore("pods").put({ slot, name, data: buf.slice(0), savedAt: Date.now() });
        } catch (e) {}
      }

      async function clearPodDB() {
        try {
          const db = await openPodDB();
          if (!db) return;
          const tx = db.transaction("pods", "readwrite");
          tx.objectStore("pods").clear();
        } catch (e) {}
      }

      function isValidGlbBuffer(buf) {
        if (!buf || buf.byteLength < 12) return false;
        return new DataView(buf).getUint32(0, true) === 0x46546c67; // "glTF"
      }

      function parseAndMountGlb(arrayBuffer, fileName, slotIdx) {
        return new Promise((resolve, reject) => {
          gltfLoader.parse(
            arrayBuffer.slice(0),
            "",
            (gltf) => {
              const targetEm = embryos[slotIdx];
              if (targetEm && gltf.scene) {
                targetEm.attachCustomGlb(gltf.scene, fileName);
              }
              resolve(slotIdx);
            },
            (err) => reject(err)
          );
        });
      }

      function setSyncPromptVisible(show) {
        syncFolderBtnEl.classList.toggle("is-hidden", !show);
        syncFolderSepEl.classList.toggle("is-hidden", !show);
        whisperControlsEl.classList.toggle("needs-sync", show);
      }

      async function discoverPodUrlsFromDirectory() {
        try {
          const res = await fetch(MODELS_DIR);
          if (!res.ok) return [];
          const html = await res.text();
          const found = new Set();
          const linkRe = /href=["']([^"']*pod_[^"'?#]+\.glb)["']/gi;
          let match;
          while ((match = linkRe.exec(html)) !== null) {
            const raw = decodeURIComponent(match[1]);
            const fileName = raw.split("/").pop();
            if (fileName && /^pod_.*\.glb$/i.test(fileName)) {
              found.add(`${MODELS_DIR}${fileName}`);
            }
          }
          return Array.from(found).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
        } catch (e) {
          return [];
        }
      }

      async function restoreCachedPods() {
        const db = await openPodDB();
        if (!db) return;
        const records = await new Promise((resolve) => {
          const req = db.transaction("pods", "readonly").objectStore("pods").getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
        db.close();
        for (const rec of records) {
          if (!rec?.data || !embryos[rec.slot] || embryos[rec.slot].hasCustomGlb) continue;
          try {
            await parseAndMountGlb(rec.data, rec.name, rec.slot);
          } catch (err) {
            console.warn("Could not restore cached pod", rec.slot, err);
          }
        }
      }

      async function autoDiscoverAndLoadPods() {
        const fromFile = location.protocol === "file:";
        if (fromFile) await restoreCachedPods().catch(err => console.warn("Pod cache unavailable", err));
        const base = fromFile ? "https://fatal-nan.github.io/Semantic-City-HTML/" : document.baseURI;
        // GitHub Pages serves static files without a directory index.
        const useManifest = fromFile || location.hostname.endsWith(".github.io");
        const discovered = useManifest ? [] : await discoverPodUrlsFromDirectory();
        const urls = (discovered.length ? discovered : FALLBACK_POD_URLS).slice(0, ACTIVE_SLOTS);
        await Promise.all(urls.map(async (path, i) => {
          const slot = GLB_SLOT_PRIORITY[i];
          if (embryos[slot].hasCustomGlb) return;
          try {
            const url = new URL(path, base);
            let data;
            try {
              data = await window.loadPackedSpecimen(url);
            } catch {
              const response = await fetch(url);
              if (!response.ok) throw Error("HTTP " + response.status);
              data = await response.arrayBuffer();
            }
            if (!isValidGlbBuffer(data)) throw Error("Invalid GLB header");
            const name = url.pathname.split("/").pop();
            const gltf = await gltfLoader.parseAsync(data, new URL(".", url).href);
            if (!embryos[slot].hasCustomGlb) {
              embryos[slot].attachCustomGlb(gltf.scene, name);
              console.info("Mounted pod", name, slot);
            }
          } catch (err) { console.warn("Could not load pod", path, err); }
        }));
        const missing = () => urls.some((_, i) => !embryos[GLB_SLOT_PRIORITY[i]].hasCustomGlb);
        if (!fromFile && missing()) await restoreCachedPods().catch(err => console.warn("Pod cache unavailable", err));
        setSyncPromptVisible(missing());
      }

      // 一次性同步整个 models 文件夹：自动筛选所有 pod_*.glb 并永久缓存，之后双击直接自动加载
      syncFolderBtnEl.addEventListener("click", () => modelsFolderInput.click());
      modelsFolderInput.addEventListener("change", async (e) => {
        const allFiles = Array.from(e.target.files || []);
        e.target.value = "";
        if (!allFiles.length) return;

        let podFiles = allFiles.filter((f) => /^pod_.*\.glb$/i.test(f.name));
        if (podFiles.length === 0) {
          podFiles = allFiles.filter((f) => /\.glb$/i.test(f.name));
        }
        podFiles.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
        if (!podFiles.length) return;

        await clearPodDB();
        embryos.forEach((em) => em.clearCustomGlb());

        let mounted = 0;
        const names = [];
        for (let i = 0; i < podFiles.length && mounted < ACTIVE_SLOTS; i++) {
          const file = podFiles[i];
          try {
            const buf = await file.arrayBuffer();
            if (!isValidGlbBuffer(buf)) continue;
            const slotIdx = GLB_SLOT_PRIORITY[mounted];
            await parseAndMountGlb(buf, file.name, slotIdx);
            await savePodToDB(slotIdx, file.name, buf);
            names.push(file.name.replace(/\.glb$/i, ""));
            mounted++;
          } catch (err) {
            console.error("同步 GLB 失败:", file.name, err);
          }
        }

        if (mounted > 0) {
          setSyncPromptVisible(false);
          setNarration(
            uiLang === "en"
              ? `${mounted} pods synced and remembered. Future opens will load them automatically.`
              : `已自动筛选并记住 ${mounted} 个 pod 模型，以后直接双击打开就会自动加载。`,
            names.join(" · "),
            true
          );
        }
      });

      // ==================== 7. 复读光丝 + 文化事件极光射线 ====================
      function createEchoFilamentsSystem() {
        const MAX_FIL = 32, SEG = 12, VPF = SEG * 2, TOTAL = MAX_FIL * VPF;
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(TOTAL * 3), 3));
        geo.setAttribute("aParam", new THREE.BufferAttribute(new Float32Array(TOTAL * 2), 2));
        geo.setAttribute("aColor", new THREE.BufferAttribute(new Float32Array(TOTAL * 3), 3));
        geo.setAttribute("aAlpha", new THREE.BufferAttribute(new Float32Array(TOTAL), 1));

        const lines = new THREE.LineSegments(geo, new THREE.ShaderMaterial({
          transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
          vertexShader: `attribute vec2 aParam; attribute vec3 aColor; attribute float aAlpha; varying vec2 vParam; varying vec3 vColor; varying float vAlpha; void main(){ vParam=aParam; vColor=aColor; vAlpha=aAlpha; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
          fragmentShader: `
            varying vec2 vParam; varying vec3 vColor; varying float vAlpha;
            void main() {
              if (vAlpha <= 0.005) discard;
              float dh = vParam.y - vParam.x;
              float pkt = smoothstep(-0.08, 0.02, dh) * exp(-max(0.0, dh) * 4.8);
              float tr = smoothstep(0.0, 0.14, vParam.x) * (1.0 - smoothstep(0.88, 1.0, vParam.x)) * 0.24;
              gl_FragColor = vec4(mix(vColor, vec3(1.0, 0.92, 0.82), pkt * 0.68), clamp(pkt * 1.35 + tr, 0.0, 1.0) * vAlpha);
            }
          `
        }));
        lines.frustumCulled = false; lines.renderOrder = 8; cellWorldGroup.add(lines);

        const pool = Array.from({ length: MAX_FIL }, () => ({ active: false, age: 0, duration: 0.78, start: new THREE.Vector3(), ctrl: new THREE.Vector3(), targetIndex: 0, color: new THREE.Color() }));
        let cursor = 0;
        const pA = new THREE.Vector3(), pB = new THREE.Vector3();
        function evalB(out, p0, p1, p2, u) { const iv = 1 - u; out.set(iv * iv * p0.x + 2 * iv * u * p1.x + u * u * p2.x, iv * iv * p0.y + 2 * iv * u * p1.y + u * u * p2.y, iv * iv * p0.z + 2 * iv * u * p1.z + u * u * p2.z); }
        return {
          spawnBurst(targetIndex, count = 6, colorHex = 0x7dd3fc, accentHex = 0xf472b6) {
            const target = embryos[targetIndex]; if (!target) return;
            for (let n = 0; n < count; n++) {
              const s = pool[cursor++ % MAX_FIL];
              s.active = true; s.age = -n * 0.045; s.duration = 0.68 + Math.random() * 0.4; s.targetIndex = targetIndex;
              s.start.copy(dormantSeeds[Math.floor(Math.random() * dormantSeeds.length)].basePos);
              s.ctrl.copy(s.start).lerp(target.pos, 0.5).add(new THREE.Vector3((Math.random() - 0.5) * 0.95, (Math.random() - 0.5) * 0.95, (Math.random() - 0.5) * 0.95));
              s.color.setHex(n % 2 === 0 ? colorHex : accentHex).lerp(new THREE.Color(0xfff1dc), 0.22);
            }
          },
          update(dt) {
            const posA = geo.attributes.position, parA = geo.attributes.aParam, colA = geo.attributes.aColor, alpA = geo.attributes.aAlpha;
            let dirty = false;
            for (let i = 0; i < MAX_FIL; i++) {
              const s = pool[i], baseV = i * VPF;
              if (!s.active) { if (alpA.array[baseV] > 0) { for (let k = 0; k < VPF; k++) alpA.array[baseV + k] = 0; dirty = true; } continue; }
              dirty = true; s.age += dt;
              if (s.age < 0) { for (let k = 0; k < VPF; k++) alpA.array[baseV + k] = 0; continue; }
              const pr = s.age / s.duration;
              if (pr >= 1) { s.active = false; for (let k = 0; k < VPF; k++) alpA.array[baseV + k] = 0; continue; }
              const tPos = embryos[s.targetIndex].pos, headU = Math.min(1.22, pr * 1.35), envA = Math.sin(Math.min(1, pr) * Math.PI) * 0.9;
              for (let j = 0; j < SEG; j++) {
                const u0 = j / SEG, u1 = (j + 1) / SEG;
                evalB(pA, s.start, s.ctrl, tPos, u0); evalB(pB, s.start, s.ctrl, tPos, u1);
                const v0 = baseV + j * 2, v1 = v0 + 1;
                posA.setXYZ(v0, pA.x, pA.y, pA.z); posA.setXYZ(v1, pB.x, pB.y, pB.z);
                parA.setXY(v0, u0, headU); parA.setXY(v1, u1, headU);
                colA.setXYZ(v0, s.color.r, s.color.g, s.color.b); colA.setXYZ(v1, s.color.r, s.color.g, s.color.b);
                alpA.array[v0] = alpA.array[v1] = envA;
              }
            }
            if (dirty) posA.needsUpdate = parA.needsUpdate = colA.needsUpdate = alpA.needsUpdate = true;
          }
        };
      }
      const echoFilaments = createEchoFilamentsSystem();

      function createCatalystAuroraBeam() {
        const group = new THREE.Group(); group.visible = false; cellWorldGroup.add(group);
        const beamU = { uTime: { value: 0 }, uProgress: { value: 0 }, uColorA: { value: new THREE.Color(0xfdba74) }, uColorB: { value: new THREE.Color(0xf472b6) } };
        const outerGeo = new THREE.CylinderGeometry(0.38, 0.075, 1.0, 18, 1, true); outerGeo.translate(0, 0.5, 0);
        const outerBeam = new THREE.Mesh(outerGeo, new THREE.ShaderMaterial({
          uniforms: beamU, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
          vertexShader: `varying vec2 vUv; varying vec3 vNormal, vViewDir; void main(){ vUv=uv; vec4 wp=modelMatrix*vec4(position,1.0); vNormal=normalize(mat3(modelMatrix)*normal); vViewDir=normalize(cameraPosition-wp.xyz); gl_Position=projectionMatrix*viewMatrix*wp; }`,
          fragmentShader: `
            uniform float uTime, uProgress; uniform vec3 uColorA, uColorB; varying vec2 vUv; varying vec3 vNormal, vViewDir;
            void main() {
              float front = 1.0 - smoothstep(0.0, 0.24, uProgress);
              float mask = smoothstep(front - 0.14, front + 0.04, vUv.y);
              float fade = 1.0 - smoothstep(0.32, 1.0, uProgress);
              float edge = pow(abs(dot(normalize(vNormal), normalize(vViewDir))), 0.68);
              float rib = 0.55 + 0.45 * sin(vUv.x * 18.85 + vUv.y * 8.0 + uTime * 10.0);
              float tip = exp(-vUv.y * 5.0);
              vec3 col = mix(mix(uColorA, uColorB, vUv.y), vec3(1.0, 0.92, 0.84), tip * 0.72 + edge * 0.22);
              float a = edge * rib * (1.0 - smoothstep(0.74, 1.0, vUv.y)) * mask * fade * (0.62 + tip * 0.62);
              if (a < 0.01) discard;
              gl_FragColor = vec4(col, clamp(a, 0.0, 0.92));
            }
          `
        }));
        outerBeam.renderOrder = 11; group.add(outerBeam);
        const impactRing = new THREE.Mesh(new THREE.RingGeometry(0.16, 0.22, 36), new THREE.MeshBasicMaterial({ color: 0xfff1dc, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false }));
        impactRing.renderOrder = 12; cellWorldGroup.add(impactRing);

        const st = { active: false, age: 0, duration: 2.3, targetIndex: -1, dir: new THREE.Vector3(0, 1, 0), fired: false };
        const up = new THREE.Vector3(0, 1, 0), q = new THREE.Quaternion();
        return {
          group,
          impactRing,
          isActive: () => st.active,
          fireAt(idx) {
            const em = embryos[idx]; if (!em) return;
            st.active = true; st.age = 0; st.targetIndex = idx; st.dir.copy(em.dir).normalize(); st.fired = false;
            beamU.uColorA.value.setHex(em.cfg.color); beamU.uColorB.value.setHex(em.cfg.accent);
            impactRing.material.color.setHex(em.cfg.color).lerp(new THREE.Color(0xfff1dc), 0.35);
            group.visible = impactRing.visible = true;
          },
          update(dt, tSec, onImpact) {
            if (!st.active) return;
            st.age += dt; const p = st.age / st.duration;
            if (p >= 1) { st.active = group.visible = impactRing.visible = false; return; }
            const em = embryos[st.targetIndex];
            beamU.uTime.value = tSec; beamU.uProgress.value = p;
            st.dir.lerp(em.dir, dt * 6).normalize();
            group.position.copy(em.pos); q.setFromUnitVectors(up, st.dir); group.quaternion.copy(q);
            group.scale.set(1 - p * 0.25, 8.6, 1 - p * 0.25);
            if (!st.fired && p >= 0.16) { st.fired = true; if (onImpact) onImpact(em); }
            const rp = Math.max(0, (p - 0.12) / 0.65);
            if (rp > 0 && rp < 1) {
              impactRing.visible = true; impactRing.position.copy(st.dir).multiplyScalar(MEMBRANE_RADIUS + 0.06);
              impactRing.lookAt(st.dir.clone().multiplyScalar(MEMBRANE_RADIUS + 3));
              impactRing.scale.set(0.6 + rp * 5, 0.6 + rp * 5, 1); impactRing.material.opacity = (1 - rp) * 0.80;
            } else impactRing.visible = false;
          }
        };
      }
      const catalystBeam = createCatalystAuroraBeam();

      const contagionState = { active: false, radius: 0, strength: 0, origin: new THREE.Vector3(), color: new THREE.Color(0xf472b6) };
      function emitContagionWave(originPos, colorHex, initialStrength = 1.0) {
        contagionState.active = true; contagionState.radius = 0.15; contagionState.strength = initialStrength;
        contagionState.origin.copy(originPos); contagionState.color.setHex(colorHex);
      }

      // ==================== 8. 启动预编译 ====================
      function prewarmThreeShaders() {
        embryos.forEach((em) => { em.root.visible = true; em.burstField.group.visible = true; });
        companionBlobs.forEach((cb) => { cb.mesh.visible = true; });
        catalystBeam.group.visible = true;
        catalystBeam.impactRing.visible = true;

        renderer.compile(scene, camera);
        renderer.render(scene, camera);
        renderer.clear();

        catalystBeam.group.visible = false;
        catalystBeam.impactRing.visible = false;
        embryos.forEach((em) => { em.root.visible = false; em.burstField.group.visible = false; });
        companionBlobs.forEach((cb) => { cb.mesh.visible = false; });
      }

      // ==================== 9. 极简旁白系统与交互 ====================
      let introElapsed = 0, introPaused = false, introComplete = false, currentBeatIdx = -1;
      let sealRippleFired = false, awakenEchoStage = 0;
      let selectedIndex = 0, stirEnergy = 0, autoCatalystCooldown = 7.5;
      let hoveredSpecimenIdx = -1, heldSpecimenIdx = -1;
      let narrationFadeTimer = null;
      let lastCustomNarration = null;

      function setNarration(line, note = "", fade = true) {
        const apply = () => {
          narrationLineEl.textContent = line;
          narrationNoteEl.textContent = note;
        };
        if (!fade) {
          clearTimeout(narrationFadeTimer);
          narrationStageEl.classList.remove("is-fading");
          apply();
          return;
        }
        narrationStageEl.classList.add("is-fading");
        clearTimeout(narrationFadeTimer);
        narrationFadeTimer = setTimeout(() => {
          apply();
          narrationStageEl.classList.remove("is-fading");
        }, 260);
      }

      function syncControlLabels() {
        document.documentElement.lang = uiLang === "en" ? "en" : "zh-CN";
        syncFolderBtnEl.textContent = uiLang === "en" ? "Sync models folder" : "同步 models 文件夹";

      function updateIntroNarration(uIntro) {
        let idx = NARRATION_BEATS.length - 1;
        for (let i = 0; i < NARRATION_BEATS.length; i++) {
          if (uIntro < NARRATION_BEATS[i].until) { idx = i; break; }
        }
        if (idx !== currentBeatIdx) {
          const shouldFade = currentBeatIdx >= 0;
          currentBeatIdx = idx;
          const b = NARRATION_BEATS[idx][uiLang];
          setNarration(b.line, b.note, shouldFade);
