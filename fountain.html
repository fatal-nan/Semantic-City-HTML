<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Semantic Fountain</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@500;600;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'"
    />
    <style>
      :root {
        color-scheme: dark;
        --u: min(calc(100vw / 940), calc(100vh / 610));
        --font-display: "Syne", "Helvetica Neue", Arial, sans-serif;
        --font-serif: "Instrument Serif", Georgia, "Times New Roman", serif;
        --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: "IBM Plex Mono", Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #c4ccee;
        font-family: var(--font-sans);
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      .lc-stage-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: #c4ccee;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }

      .lc-stage-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(circle at 36% 45%, rgba(210, 228, 255, 0.36), transparent 52%),
          radial-gradient(circle at 72% 28%, rgba(226, 198, 255, 0.28), transparent 48%),
          linear-gradient(to bottom, rgba(204, 213, 244, 0.24), rgba(132, 165, 205, 0.28)),
          #c4ccee;
        pointer-events: none;
      }

      .lc-canvas-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
      }

      #lcRainCanvas {
        z-index: 1;
      }

      #lcGlCanvas {
        z-index: 2;
      }

      #lcFrontCanvas {
        z-index: 3;
      }

      /* Responsive corner-hugging WebGL2 jelly dialog box tuned for English narrative copy */
      .jelly-dialog-wrap {
        position: relative;
        z-index: 6;
        pointer-events: auto;
        width: clamp(440px, 54vw, 700px);
        height: clamp(185px, 24vh, 235px);
        align-self: flex-start;
        margin: auto 0 clamp(10px, 2vh, 22px) clamp(10px, 2vw, 22px);
        flex-shrink: 0;
        user-select: none;
      }

      @media (max-width: 720px) {
        .jelly-dialog-wrap {
          width: calc(100vw - 16px);
          height: clamp(175px, 27vh, 220px);
          margin: auto 8px 8px 8px;
        }
      }

      .jelly-dialog-canvas {
        width: 100%;
        height: 100%;
        display: block;
        cursor: pointer;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div class="lc-stage-container" id="lcStageContainer">
      <div class="lc-stage-bg" aria-hidden="true"></div>
      <canvas class="lc-canvas-layer" id="lcRainCanvas"></canvas>
      <canvas class="lc-canvas-layer" id="lcGlCanvas"></canvas>
      <canvas class="lc-canvas-layer" id="lcFrontCanvas"></canvas>

      <div class="jelly-dialog-wrap" id="lcJellyWrap" title="Move or drag across the jelly dialog box to deform it">
        <canvas class="jelly-dialog-canvas" id="lcJellyCanvas"></canvas>
      </div>
    </div>

    <script>
      // ==================== 1. WebGL2 Elastic Jelly Dialog Box Engine ====================
      function createJellyDialogBox(canvasId, initialSpeaker, initialLines, opts = {}) {
        const jCanvas = document.getElementById(canvasId);
        if (!jCanvas) return null;

        let jgl = null;
        try {
          jgl = jCanvas.getContext("webgl2", {
            alpha: true,
            antialias: true,
            premultipliedAlpha: false
          });
        } catch (err) {
          console.error("Failed to initialize Jelly WebGL2 context:", err);
          return null;
        }
        if (!jgl) return null;

        jgl.getExtension("EXT_color_buffer_float");
        jgl.getExtension("OES_texture_float_linear");

        const vsSrc = `#version 300 es
          in vec2 p;
          void main() {
            gl_Position = vec4(p, 0.0, 1.0);
          }
        `;

        // Buffer A: Stores interactive pointer pressure & elastic impulse decay field
        const fsBufASrc = `#version 300 es
          precision highp float;
          out vec4 O;
          uniform vec2 iResolution;
          uniform vec4 iMouse;
          uniform float uImpulse;
          uniform vec2 uImpulsePos;
          uniform sampler2D iChannel0;

          void main() {
            vec2 uv = gl_FragCoord.xy / iResolution.xy;
            float jelly = texture(iChannel0, uv).r;

            if (iMouse.z > 0.0) {
              vec2 m = iMouse.xy / iResolution.xy;
              vec2 pm = iMouse.zw / iResolution.xy;
              float speed = clamp(length(m - pm) * 56.0, 0.0, 14.5);
              float pressure = exp(-distance(uv, m) * 12.5);
              jelly = clamp(jelly + pressure * speed * 0.017 - 0.0025, 0.0, 0.92);
            } else {
              jelly = max(jelly - 0.032, 0.0);
            }

            if (uImpulse > 0.001) {
              float pImp = exp(-distance(uv, uImpulsePos) * 8.0);
              jelly = clamp(jelly + pImp * uImpulse, 0.0, 0.92);
            }

            O = vec4(jelly, 0.0, 0.0, 1.0);
          }
        `;

        // Main Image Pass: Smooth-min fused rounded body + title tab with refined silver-lavender editorial text
        const fsImageSrc = `#version 300 es
          precision highp float;
          out vec4 O;
          uniform vec2 iResolution;
          uniform float iTime;
          uniform vec4 iMouse;
          uniform vec2 uBoxSize;
          uniform vec3 uTabSpec;
          uniform float uTextAlpha;
          uniform float uTextShift;
          uniform sampler2D iChannel0;
          uniform sampler2D iChannel1;

          float hash(vec2 p) {
            return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
          }
          float noise(vec2 p) {
            vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
            return mix(
              mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
              mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
              u.y
            );
          }
          vec2 n2(vec2 p, float t, float o) {
            return vec2(noise(p + t), noise(p + t + o));
          }
          float sdRoundRect(vec2 p, vec2 b, float r) {
            vec2 q = abs(p) - b + r;
            return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
          }
          float smin(float a, float b, float k) {
            float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
            return mix(b, a, h) - k * h * (1.0 - h);
          }

          float sdFreeformJelly(vec2 p, vec2 box, vec3 tabSpec, float jelly) {
            vec2 boxCenter = vec2(0.0, -0.095);
            vec2 tabCenter = vec2(-box.x + tabSpec.x + 0.04, boxCenter.y + box.y + tabSpec.y * 0.56);
            float rBase = min(box.y * 0.42, 0.125) + jelly * 0.032;
            float dMain = sdRoundRect(p - boxCenter, box, rBase);
            float dTab  = sdRoundRect(p - tabCenter, tabSpec.xy, tabSpec.z);
            return smin(dMain, dTab, 0.042);
          }

          void main() {
            vec2 R = iResolution.xy;
            vec2 U = gl_FragCoord.xy;
            float aspect = R.x / max(1.0, R.y);
            vec2 uv = (U - 0.5 * R) / R.y;
            vec2 m  = (iMouse.xy - 0.5 * R) / R.y;
            float jelly = texture(iChannel1, U / R).r;

            vec2 box = vec2(
              min(uBoxSize.x, 0.5 * aspect - 0.075),
              min(uBoxSize.y, 0.305)
            );
            vec3 tabSpec = vec3(
              min(uTabSpec.x, box.x * 0.92),
              min(uTabSpec.y, 0.092),
              uTabSpec.z
            );

            // Subtle refraction on text when interacting, crisp when resting
            vec2 toM = m - uv;
            vec2 tUV = uv - normalize(toM + 1e-5) * exp(-length(toM) * 2.6) * jelly * 0.022;
            tUV.y -= uTextShift;

            vec2 texCoord = vec2(tUV.x / aspect + 0.5, 0.5 - tUV.y);
            vec4 txtSample = vec4(0.0);
            if (texCoord.x >= 0.0 && texCoord.x <= 1.0 && texCoord.y >= 0.0 && texCoord.y <= 1.0) {
              txtSample = texture(iChannel0, texCoord);
            }
            float tVis = clamp(uTextAlpha, 0.0, 1.0);
            float nameTxt = txtSample.r * tVis;
            float dlgTxt  = txtSample.g * tVis;
            float txtHalo = txtSample.b * tVis;

            // Organic breathing ripple and pointer indentation
            vec2 uvB = uv + (n2(uv * 4.5, iTime * 0.85, 10.0) - 0.5) * 0.022;
            vec2 e = vec2(0.0015, 0.0);
            vec2 n = normalize(vec2(
              sdFreeformJelly(uvB + e.xy, box, tabSpec, jelly) - sdFreeformJelly(uvB - e.xy, box, tabSpec, jelly),
              sdFreeformJelly(uvB + e.yx, box, tabSpec, jelly) - sdFreeformJelly(uvB - e.yx, box, tabSpec, jelly)
            ));

            vec2 uvD = uvB - n * jelly * exp(-distance(uvB, m) * 9.5) * 0.11;
            uvD += (n2(uvD * 9.0, iTime, 20.0) - 0.5) * jelly * 0.036;

            float d = sdFreeformJelly(uvD, box, tabSpec, jelly);

            float insideAlpha = 1.0 - smoothstep(-0.003, 0.006, d);
            if (insideAlpha <= 0.002) {
              O = vec4(0.0);
              return;
            }

            // Deep midnight-violet translucent jelly body for strong editorial contrast
            vec3 bodyBase = mix(vec3(0.042, 0.034, 0.096), vec3(0.112, 0.084, 0.198), smoothstep(-0.30, 0.0, d));
            bodyBase += vec3(0.20, 0.15, 0.34) * jelly * exp(-distance(uv, m) * 4.0);

            // Delicate moonlit rim highlight
            float rimMask = smoothstep(-0.009, -0.003, d) * (1.0 - smoothstep(-0.0005, 0.0035, d));

            vec3 col = bodyBase;
            col = mix(col, vec3(0.90, 0.89, 0.99), rimMask * 0.78);

            // Soft drop shadow encoded in blue channel
            col *= 1.0 - clamp(txtHalo * 0.42, 0.0, 0.42);

            // Refined pearl silver-lavender title & clean parchment-white narrative copy (no rainbow)
            vec3 titleTone = mix(vec3(0.83, 0.84, 0.99), vec3(0.96, 0.95, 1.0), 0.5 + 0.5 * sin(uv.x * 1.4 - iTime * 0.55));
            col = mix(col, titleTone, clamp(nameTxt * 1.15, 0.0, 1.0));
            col = mix(col, vec3(0.96, 0.97, 1.0), clamp(dlgTxt * 1.15, 0.0, 1.0));

            float txtMask = max(nameTxt, dlgTxt);
            float finalAlpha = clamp(insideAlpha * 0.90 + rimMask * 0.95 + txtMask * 0.98, 0.0, 0.97);
            O = vec4(col, finalAlpha);
          }
        `;

        function compileProg(fsSourceStr) {
          const p = jgl.createProgram();
          [
            [jgl.VERTEX_SHADER, vsSrc],
            [jgl.FRAGMENT_SHADER, fsSourceStr]
          ].forEach(([type, src]) => {
            const sh = jgl.createShader(type);
            jgl.shaderSource(sh, src);
            jgl.compileShader(sh);
            if (!jgl.getShaderParameter(sh, jgl.COMPILE_STATUS)) {
              console.error("Jelly shader compile error:", jgl.getShaderInfoLog(sh));
            }
            jgl.attachShader(p, sh);
          });
          jgl.linkProgram(p);
          return p;
        }

        const progA = compileProg(fsBufASrc);
        const progImg = compileProg(fsImageSrc);

        const quad = jgl.createBuffer();
        jgl.bindBuffer(jgl.ARRAY_BUFFER, quad);
        jgl.bufferData(jgl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), jgl.STATIC_DRAW);

        const fbos = [0, 1].map(() => {
          const tex = jgl.createTexture();
          const fbo = jgl.createFramebuffer();
          jgl.bindTexture(jgl.TEXTURE_2D, tex);
          jgl.texParameteri(jgl.TEXTURE_2D, jgl.TEXTURE_MIN_FILTER, jgl.LINEAR);
          jgl.texParameteri(jgl.TEXTURE_2D, jgl.TEXTURE_MAG_FILTER, jgl.LINEAR);
          jgl.texParameteri(jgl.TEXTURE_2D, jgl.TEXTURE_WRAP_S, jgl.CLAMP_TO_EDGE);
          jgl.texParameteri(jgl.TEXTURE_2D, jgl.TEXTURE_WRAP_T, jgl.CLAMP_TO_EDGE);
          jgl.bindFramebuffer(jgl.FRAMEBUFFER, fbo);
          jgl.framebufferTexture2D(jgl.FRAMEBUFFER, jgl.COLOR_ATTACHMENT0, jgl.TEXTURE_2D, tex, 0);
          return { tex, fbo };
        });

        const textCvs = document.createElement("canvas");
        textCvs.width = 1600;
        textCvs.height = 720;
        const tCtx = textCvs.getContext("2d");

        const textTex = jgl.createTexture();
        jgl.bindTexture(jgl.TEXTURE_2D, textTex);
        jgl.texParameteri(jgl.TEXTURE_2D, jgl.TEXTURE_MIN_FILTER, jgl.LINEAR);
        jgl.texParameteri(jgl.TEXTURE_2D, jgl.TEXTURE_MAG_FILTER, jgl.LINEAR);
        jgl.texParameteri(jgl.TEXTURE_2D, jgl.TEXTURE_WRAP_S, jgl.CLAMP_TO_EDGE);
        jgl.texParameteri(jgl.TEXTURE_2D, jgl.TEXTURE_WRAP_T, jgl.CLAMP_TO_EDGE);

        const boxHalfWMax = opts.boxHalfW || 1.65;
        const boxHalfHMax = opts.boxHalfH || 0.305;
        const tabHalfHMax = opts.tabHalfH || 0.088;
        const tabRad = opts.tabRad || 0.082;

        let targetBoxSize = [1.35, 0.305];
        let currentBoxSize = [1.35, 0.305];
        let targetTabSpec = [0.75, 0.088, 0.082];
        let currentTabSpec = [0.75, 0.088, 0.082];
        let hasInitializedLayout = false;

        let curSpeaker = initialSpeaker || "The Fountain";
        let curLines = Array.isArray(initialLines) ? initialLines : [String(initialLines || "")];
        let pendingContent = null;
        let transPhase = "idle";
        let transAlpha = 1.0;
        let lastRenderTime = null;
        let fboIdx = 0;
        let mouse = [0, 0];
        let prevMouse = [0, 0];
        let pointerActive = false;
        let moveTimeout = null;
        let impulseStrength = 0.55;
        let impulsePos = [0.35, 0.55];

        // Word-aware line wrapper with clean fallback for long tokens
        function wrapCanvasLines(ctx, text, maxWidth) {
          const words = text.split(/\s+/).filter(Boolean);
          if (words.length === 0) return [""];

          const lines = [];
          let current = "";

          for (let i = 0; i < words.length; i++) {
            const word = words[i];
            const test = current ? current + " " + word : word;
            if (ctx.measureText(test).width <= maxWidth) {
              current = test;
            } else {
              if (current) lines.push(current);
              if (ctx.measureText(word).width <= maxWidth) {
                current = word;
              } else {
                // Break overly long token character by character
                let chunk = "";
                for (const ch of Array.from(word)) {
                  if (ctx.measureText(chunk + ch).width > maxWidth && chunk) {
                    lines.push(chunk);
                    chunk = ch;
                  } else {
                    chunk += ch;
                  }
                }
                current = chunk;
              }
            }
          }
          if (current) lines.push(current);
          return lines;
        }

        // Cross-browser tracked text measurement & rendering
        function measureTrackedText(ctx, text, tracking) {
          if (!tracking) return ctx.measureText(text).width;
          const chars = Array.from(text);
          let total = 0;
          for (let i = 0; i < chars.length; i++) {
            total += ctx.measureText(chars[i]).width;
            if (i < chars.length - 1) total += tracking;
          }
          return total;
        }

        function fillTrackedText(ctx, text, x, y, tracking) {
          if (!tracking) {
            ctx.fillText(text, x, y);
            return;
          }
          const chars = Array.from(text);
          let cursor = x;
          for (let i = 0; i < chars.length; i++) {
            ctx.fillText(chars[i], cursor, y);
            cursor += ctx.measureText(chars[i]).width + tracking;
          }
        }

        function updateTextTexture() {
          const rect = jCanvas.getBoundingClientRect();
          const cssW = Math.max(300, rect.width || 620);
          const cssH = Math.max(170, rect.height || 210);
          const aspect = cssW / cssH;

          // Keep 1:1 pixel aspect ratio so typography never stretches horizontally
          const H = 720;
          const W = Math.max(960, Math.round(H * aspect));
          if (textCvs.width !== W || textCvs.height !== H) {
            textCvs.width = W;
            textCvs.height = H;
          }

          const effBoxHalfW = Math.min(boxHalfWMax, 0.5 * aspect - 0.075);
          const effBoxHalfH = Math.min(boxHalfHMax, 0.305);
          const effTabHalfH = Math.min(tabHalfHMax, 0.088);

          const uvToPxX = (uvX) => (uvX / aspect + 0.5) * W;
          const uvToPxY = (uvY) => (0.5 - uvY) * H;
          const pxToUv = (px) => px / H;

          const boxCenterY = -0.095;
          const tabCenterY = boxCenterY + effBoxHalfH + effTabHalfH * 0.56;

          // Editorial uppercase tracked title inside auto-sized top capsule
          const displayTitle = curSpeaker.toUpperCase();
          const maxTabHalfW = effBoxHalfW * 0.92;
          let titleFontPx = Math.round(H * 0.056);
          let titleTracking = Math.round(titleFontPx * 0.085);
          tCtx.font = `600 ${titleFontPx}px "Syne", "Plus Jakarta Sans", sans-serif`;
          let measuredTitleW = measureTrackedText(tCtx, displayTitle, titleTracking);
          const maxAllowedTitlePx = (maxTabHalfW * 2 - 0.16) * H;

          if (measuredTitleW > maxAllowedTitlePx && maxAllowedTitlePx > 120) {
            const shrink = maxAllowedTitlePx / measuredTitleW;
            titleFontPx = Math.max(24, Math.floor(titleFontPx * shrink));
            titleTracking = Math.max(1, Math.round(titleFontPx * 0.07));
            tCtx.font = `600 ${titleFontPx}px "Syne", "Plus Jakarta Sans", sans-serif`;
            measuredTitleW = measureTrackedText(tCtx, displayTitle, titleTracking);
          }

          const effTabHalfW = Math.min(maxTabHalfW, Math.max(0.36, pxToUv(measuredTitleW) * 0.5 + 0.095));
          const tabCenterX = -effBoxHalfW + effTabHalfW + 0.04;

          targetBoxSize = [effBoxHalfW, effBoxHalfH];
          targetTabSpec = [effTabHalfW, effTabHalfH, Math.min(tabRad, effTabHalfH * 0.94)];
          if (!hasInitializedLayout) {
            currentBoxSize = [...targetBoxSize];
            currentTabSpec = [...targetTabSpec];
            hasInitializedLayout = true;
          }

          // Narrative body area with balanced margins
          const bodyLeftPx = uvToPxX(-effBoxHalfW + 0.115);
          const bodyRightPx = uvToPxX(effBoxHalfW - 0.115);
          const maxLineW = Math.max(240, bodyRightPx - bodyLeftPx);

          const boxTopPx = uvToPxY(boxCenterY + effBoxHalfH - 0.062);
          const boxBottomPx = uvToPxY(boxCenterY - effBoxHalfH + 0.062);
          const availBodyH = Math.max(120, boxBottomPx - boxTopPx);

          let baseFontPx = Math.round(H * 0.092);
          let layoutBlocks = [];
          let totalTextH = 0;

          for (let attempt = 0; attempt < 8; attempt++) {
            layoutBlocks = [];
            totalTextH = 0;
            const paraGap = Math.round(baseFontPx * 0.32);

            for (let i = 0; i < curLines.length; i++) {
              const rawLine = curLines[i];
              const fontSize = Math.round(baseFontPx * 1.12);
              const fontStr = `400 ${fontSize}px "Instrument Serif", Georgia, serif`;
              const lineH = Math.round(fontSize * 1.28);

              tCtx.font = fontStr;
              const wrapped = wrapCanvasLines(tCtx, rawLine, maxLineW);
              layoutBlocks.push({ fontStr, lineH, wrapped });
              totalTextH += wrapped.length * lineH;
              if (i < curLines.length - 1) totalTextH += paraGap;
            }

            if (totalTextH <= availBodyH || baseFontPx <= 32) break;
            baseFontPx = Math.max(32, Math.floor(baseFontPx * 0.90));
          }

          // Encode R (title), G (body), and B (soft diffused shadow) into texture channels
          tCtx.save();
          tCtx.globalCompositeOperation = "source-over";
          tCtx.fillStyle = "#000000";
          tCtx.fillRect(0, 0, W, H);
          tCtx.globalCompositeOperation = "lighter";

          const tabLeftPx = uvToPxX(tabCenterX) - measuredTitleW * 0.5;
          const tabMidPy = uvToPxY(tabCenterY + 0.002);
          const titleFontStr = `600 ${titleFontPx}px "Syne", "Plus Jakarta Sans", sans-serif`;

          // 1) Title shadow (B) + crisp title glyphs (R)
          tCtx.font = titleFontStr;
          tCtx.textAlign = "left";
          tCtx.textBaseline = "middle";

          tCtx.shadowColor = "rgb(0, 0, 255)";
          tCtx.shadowBlur = 10;
          tCtx.shadowOffsetX = 0;
          tCtx.shadowOffsetY = 3;
          tCtx.fillStyle = "rgb(0, 0, 255)";
          fillTrackedText(tCtx, displayTitle, tabLeftPx, tabMidPy, titleTracking);

          tCtx.shadowBlur = 0;
          tCtx.shadowOffsetY = 0;
          tCtx.fillStyle = "rgb(255, 0, 0)";
          fillTrackedText(tCtx, displayTitle, tabLeftPx, tabMidPy, titleTracking);

          // 2) Body shadow (B) + crisp body glyphs (G), vertically centered
          const paraGap = Math.round(baseFontPx * 0.32);
          const startY = boxTopPx + Math.max(0, (availBodyH - totalTextH) * 0.5);

          tCtx.textAlign = "left";
          tCtx.textBaseline = "top";

          let curY = startY;
          for (let b = 0; b < layoutBlocks.length; b++) {
            const blk = layoutBlocks[b];
            tCtx.font = blk.fontStr;

            for (let w = 0; w < blk.wrapped.length; w++) {
              const lineStr = blk.wrapped[w];
              tCtx.shadowColor = "rgb(0, 0, 255)";
              tCtx.shadowBlur = 10;
              tCtx.shadowOffsetX = 0;
              tCtx.shadowOffsetY = 3;
              tCtx.fillStyle = "rgb(0, 0, 255)";
              tCtx.fillText(lineStr, bodyLeftPx, curY);

              tCtx.shadowBlur = 0;
              tCtx.shadowOffsetY = 0;
              tCtx.fillStyle = "rgb(0, 255, 0)";
              tCtx.fillText(lineStr, bodyLeftPx, curY);
              curY += blk.lineH;
            }
            curY += paraGap;
          }
          tCtx.restore();

          jgl.bindTexture(jgl.TEXTURE_2D, textTex);
          jgl.pixelStorei(jgl.UNPACK_FLIP_Y_WEBGL, false);
          jgl.texImage2D(jgl.TEXTURE_2D, 0, jgl.RGBA, jgl.RGBA, jgl.UNSIGNED_BYTE, textCvs);
        }

        function resizeJelly() {
          const rect = jCanvas.getBoundingClientRect();
          const dpr = Math.min(window.devicePixelRatio || 1, 2.0);
          const w = Math.max(320, Math.floor((rect.width || 620) * dpr));
          const h = Math.max(160, Math.floor((rect.height || 210) * dpr));
          if (jCanvas.width === w && jCanvas.height === h) return;

          jCanvas.width = w;
          jCanvas.height = h;
          fbos.forEach((b) => {
            jgl.bindTexture(jgl.TEXTURE_2D, b.tex);
            jgl.texImage2D(jgl.TEXTURE_2D, 0, jgl.RGBA, w, h, 0, jgl.RGBA, jgl.UNSIGNED_BYTE, null);
          });
          updateTextTexture();
        }

        jCanvas.addEventListener("pointermove", (e) => {
          const rect = jCanvas.getBoundingClientRect();
          const dpr = jCanvas.width / Math.max(1, rect.width);
          const nx = (e.clientX - rect.left) * dpr;
          const ny = jCanvas.height - (e.clientY - rect.top) * dpr;
          if (!pointerActive) {
            prevMouse[0] = nx;
            prevMouse[1] = ny;
          }
          mouse[0] = nx;
          mouse[1] = ny;
          pointerActive = true;
          clearTimeout(moveTimeout);
          moveTimeout = setTimeout(() => {
            pointerActive = false;
          }, 90);
        });

        jCanvas.addEventListener("pointerdown", (e) => {
          const rect = jCanvas.getBoundingClientRect();
          impulsePos = [
            (e.clientX - rect.left) / Math.max(1, rect.width),
            1.0 - (e.clientY - rect.top) / Math.max(1, rect.height)
          ];
          impulseStrength = 0.85;
        });

        resizeJelly();
        updateTextTexture();
        window.addEventListener("resize", resizeJelly);
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(updateTextTexture);
          document.fonts.addEventListener("loadingdone", updateTextTexture);
        }

        const uResA = jgl.getUniformLocation(progA, "iResolution");
        const uMouseA = jgl.getUniformLocation(progA, "iMouse");
        const uImpA = jgl.getUniformLocation(progA, "uImpulse");

        const uCh0A = jgl.getUniformLocation(progA, "iChannel0");

        const uResI = jgl.getUniformLocation(progImg, "iResolution");
        const uTimeI = jgl.getUniformLocation(progImg, "iTime");
        const uMouseI = jgl.getUniformLocation(progImg, "iMouse");
        const uBoxSizeI = jgl.getUniformLocation(progImg, "uBoxSize");
        const uTabSpecI = jgl.getUniformLocation(progImg, "uTabSpec");
        const uTextAlphaI = jgl.getUniformLocation(progImg, "uTextAlpha");
        const uTextShiftI = jgl.getUniformLocation(progImg, "uTextShift");
        const uCh0I = jgl.getUniformLocation(progImg, "iChannel0");
        const uCh1I = jgl.getUniformLocation(progImg, "iChannel1");

        return {
          setContent(speaker, lines, immediate = false) {
            const nextLines = Array.isArray(lines) ? lines : [String(lines)];
            const sameAsCurrent =
              speaker === curSpeaker && nextLines.join("\n") === curLines.join("\n");

            if (immediate) {
              curSpeaker = speaker;
              curLines = nextLines;
              pendingContent = null;
              transPhase = "idle";
              transAlpha = 1.0;
              resizeJelly();
              updateTextTexture();
              currentBoxSize = [...targetBoxSize];
              currentTabSpec = [...targetTabSpec];
              return;
            }

            if (sameAsCurrent && !pendingContent) return;

            pendingContent = { speaker, lines: nextLines };
            if (transPhase !== "out") {
              transPhase = "out";
            }
          },
          triggerPulse(strength = 0.72) {
            impulsePos = [0.25 + Math.random() * 0.5, 0.4 + Math.random() * 0.25];
            impulseStrength = strength;
          },
          resize: resizeJelly,
          render(timeSec) {
            resizeJelly();
            const dt =
              lastRenderTime === null
                ? 0.016
                : Math.min(0.05, Math.max(0.001, timeSec - lastRenderTime));
            lastRenderTime = timeSec;

            // Smooth cross-dissolve for chapter text transitions (no abrupt hard cut)
            if (transPhase === "out") {
              transAlpha = Math.max(0.0, transAlpha - dt / 0.62);
              if (transAlpha <= 0.001) {
                transAlpha = 0.0;
                if (pendingContent) {
                  curSpeaker = pendingContent.speaker;
                  curLines = pendingContent.lines;
                  pendingContent = null;
                  updateTextTexture();
                  impulsePos = [0.35 + Math.random() * 0.30, 0.48 + Math.random() * 0.14];
                  impulseStrength = 0.30;
                }
                transPhase = "in";
              }
            } else if (transPhase === "in") {
              transAlpha = Math.min(1.0, transAlpha + dt / 0.85);
              if (transAlpha >= 0.999) {
                transAlpha = 1.0;
                transPhase = "idle";
              }
            }

            // Smoothly glide capsule tab width and box dimensions instead of snapping
            const geomDamp = 1.0 - Math.exp(-5.8 * dt);
            currentBoxSize[0] += (targetBoxSize[0] - currentBoxSize[0]) * geomDamp;
            currentBoxSize[1] += (targetBoxSize[1] - currentBoxSize[1]) * geomDamp;
            currentTabSpec[0] += (targetTabSpec[0] - currentTabSpec[0]) * geomDamp;
            currentTabSpec[1] += (targetTabSpec[1] - currentTabSpec[1]) * geomDamp;
            currentTabSpec[2] += (targetTabSpec[2] - currentTabSpec[2]) * geomDamp;

            const easedAlpha = transAlpha * transAlpha * (3.0 - 2.0 * transAlpha);
            const textShift =
              transPhase === "out"
                ? (1.0 - easedAlpha) * 0.011
                : transPhase === "in"
                  ? -(1.0 - easedAlpha) * 0.013
                  : 0.0;

            const mVec = [
              mouse[0],
              mouse[1],
              pointerActive ? prevMouse[0] : -1.0,
              pointerActive ? prevMouse[1] : -1.0
            ];
            prevMouse[0] = mouse[0];
            prevMouse[1] = mouse[1];

            jgl.bindFramebuffer(jgl.FRAMEBUFFER, fbos[1 - fboIdx].fbo);
            jgl.viewport(0, 0, jCanvas.width, jCanvas.height);
            jgl.disable(jgl.BLEND);
            jgl.useProgram(progA);
            jgl.bindBuffer(jgl.ARRAY_BUFFER, quad);
            jgl.enableVertexAttribArray(0);
            jgl.vertexAttribPointer(0, 2, jgl.FLOAT, false, 0, 0);
            jgl.uniform2f(uResA, jCanvas.width, jCanvas.height);
            jgl.uniform4fv(uMouseA, mVec);
            jgl.uniform1f(uImpA, impulseStrength);
            jgl.uniform2f(uImpPosA, impulsePos[0], impulsePos[1]);
            jgl.activeTexture(jgl.TEXTURE0);
            jgl.bindTexture(jgl.TEXTURE_2D, fbos[fboIdx].tex);
            jgl.uniform1i(uCh0A, 0);
            jgl.drawArrays(jgl.TRIANGLE_STRIP, 0, 4);

            impulseStrength *= 0.86;

            jgl.bindFramebuffer(jgl.FRAMEBUFFER, null);
            jgl.viewport(0, 0, jCanvas.width, jCanvas.height);
            jgl.enable(jgl.BLEND);
            jgl.blendFunc(jgl.SRC_ALPHA, jgl.ONE_MINUS_SRC_ALPHA);
            jgl.clearColor(0, 0, 0, 0);
            jgl.clear(jgl.COLOR_BUFFER_BIT);

            jgl.useProgram(progImg);
            jgl.bindBuffer(jgl.ARRAY_BUFFER, quad);
            jgl.enableVertexAttribArray(0);
            jgl.vertexAttribPointer(0, 2, jgl.FLOAT, false, 0, 0);
            jgl.uniform2f(uResI, jCanvas.width, jCanvas.height);
            jgl.uniform1f(uTimeI, timeSec);
            jgl.uniform4fv(uMouseI, mVec);
            jgl.uniform2f(uBoxSizeI, currentBoxSize[0], currentBoxSize[1]);
            jgl.uniform3f(uTabSpecI, currentTabSpec[0], currentTabSpec[1], currentTabSpec[2]);
            jgl.uniform1f(uTextAlphaI, easedAlpha);
            jgl.uniform1f(uTextShiftI, textShift);

            jgl.activeTexture(jgl.TEXTURE0);
            jgl.bindTexture(jgl.TEXTURE_2D, textTex);
            jgl.uniform1i(uCh0I, 0);

            jgl.activeTexture(jgl.TEXTURE1);
            jgl.bindTexture(jgl.TEXTURE_2D, fbos[1 - fboIdx].tex);
            jgl.uniform1i(uCh1I, 1);

            jgl.drawArrays(jgl.TRIANGLE_STRIP, 0, 4);
            fboIdx = 1 - fboIdx;
          }
        };
      }

          x = (x * 0.1031) % 1;

          x *= x + 33.33;

          return x - Math.floor(x);

          for (let k = 0; k < count; k++) {
            const s = hash11JS(k + 15.0 + 31.0 * tier);
            const ang = (TAU * (k + 0.21 + tier * 0.18)) / count;
            const r0 = tier === 0 ? LOWER_R + 0.030 : tier === 1 ? UPPER_R + 0.022 : 0.034;
            const y0 = tier === 0 ? LOWER_Y + 0.016 : tier === 1 ? UPPER_Y + 0.010 : NOZZLE_Y;
            const vr = tier === 0 ? 0.60 + 0.23 * s : tier === 1 ? 0.38 + 0.08 * s : 0.40 + 0.17 * s;
            const vy = tier === 0 ? 0.12 : tier === 1 ? 0.095 : 2.43 + 0.62 * s;
            const endY = tier === 0 ? POOL_Y : tier === 1 ? LOWER_W : UPPER_W;

        const commonGLSL = `
          const float TAU=6.28318530718;
          const float GRAVITY=9.81;
          const float POOL_R=2.12, POOL_Y=.325;
          const float LOWER_R=1.15, LOWER_Y=1.19, LOWER_W=1.147;
          const float UPPER_R=.66, UPPER_Y=2.03, UPPER_W=1.991;
          const float NOZZLE_Y=2.285;

          float sat(float v){return clamp(v,0.,1.);}

          vec2 rotateXZ(vec2 p,float a){vec2 d=circleDir(a);return mat2(d.x,d.y,-d.y,d.x)*p;}
          float hash11(float x){
            x=fract(x*.1031);x*=x+33.33;x*=x+x;return fract(x);
          }
          float hash21(vec2 p){
            vec3 q=fract(vec3(p.xyx)*vec3(.1031,.11369,.13787));
            q+=dot(q,q.yzx+19.19);return fract((q.x+q.y)*q.z);

          float noise2(vec2 p){
            vec2 b=floor(p),f=fract(p);f=f*f*(3.-2.*f);

          struct Jet {vec3 p;vec3 v;float flight;float period;float offset;};
          Jet getJet(int tier,int k){
            float i=float(k),s=hash11(i+15.+31.*float(tier));
            float count=tier==0?float(SPILLS):(tier==1?8.:7.);
            vec2 axis=circleDir(TAU*(i+.21+float(tier)*.18)/count);
            float r=tier==0?LOWER_R+.030:(tier==1?UPPER_R+.022:.034);

          vec2 neighbor(ivec2 at,int n,vec2 here){

            float coreGlow = exp(-distGlow * 3.2) * (0.68 + 0.58 * nebulaMist);
            nebula += vec3(0.015, 0.34, 0.42) * coreGlow;
            nebula += vec3(0.04, 0.62, 0.68) * exp(-distGlow * 6.5) * (0.55 + 0.50 * nebulaFine);

            // Subtle deep Kali fractal gas veins for organic volumetric depth
            vec3 gasAcc = vec3(0.0);
            for (float l = 1.0; l <= 2.0; l++) {
              float t = iTime * (0.010 + l * 0.022);
              float angle = t * 0.20 * (mod(l, 2.0) == 0.0 ? 1.0 : -1.0);
              mat2 rot = mat2(cos(angle), sin(angle), -sin(angle), cos(angle));
              vec2 luv = (uvNeb - glowCenter * 0.45) * rot * (0.95 + l * 0.28);

              float vTeal = 0.0, vCobalt = 0.0;
              float s = 0.16;
              for (int i = 0; i < 16; i++) {
                vec3 p = s * normalize(vec3(luv, 0.26));
                p.xy *= 1.0 + clamp(dot(p.xy, p.xy), 0.0, 0.65) * 0.9;
                p += vec3(0.22 + l * 0.11, 0.28, s - 1.92 - sin(t * 0.45) * 0.10);

                for (int j = 0; j < 7; j++) {
                  float d2 = max(dot(p, p), 0.30);
                  p = abs(p) / d2 - 0.645;
                }

                float e = min(dot(p, p), 2.1);
                vTeal += e * 0.016;
                vCobalt += min(length(p.xy), 1.6) * 0.019;
                s += 0.135;
              }
              float len = length(luv);
              vTeal *= smoothstep(0.82, 0.0, len);
              vCobalt *= smoothstep(0.95, 0.0, len);
              gasAcc += vec3(vTeal * 0.06, vTeal * 0.44 + vCobalt * 0.14, vTeal * 0.56 + vCobalt * 0.48) / l;
            }
            nebula += tanh(gasAcc * 0.95) * (0.55 + 0.60 * nebulaMist);

            // --- Layer 2: Multi-scale bioluminescent stardust speckles suspended through the water ---
            float dustNear = starDustLayer(wNeb + vec2(iTime * 0.025, -iTime * 0.016), 5.6, worldPx, 11.3);
            float dustMid  = starDustLayer(wNeb * 1.12 - vec2(iTime * 0.018, iTime * 0.020), 10.8, worldPx, 37.9);
            float dustDeep = starDustLayer(wNeb * 1.25 + vec2(-iTime * 0.010, iTime * 0.014), 18.5, worldPx, 73.1);
            float dustDensity = 0.32 + 0.95 * coreGlow + 0.55 * nebulaFine;
            vec3 stardust = vec3(0.28, 0.92, 0.96) * dustNear * 0.66
                          + vec3(0.14, 0.76, 0.92) * dustMid  * 0.56
                          + vec3(0.16, 0.44, 0.98) * dustDeep * 0.46;
            nebula += stardust * dustDensity;

            // --- Layer 3: Four depth-parallax layers of translucent sapphire/cobalt face orbs (refined world scale) ---
            vec3 orbsCol = vec3(0.0);
            for (float l = 1.0; l <= 4.0; l++) {
              // Smaller, balanced physical orb sizes so telephoto close-ups frame multiple orbs comfortably
              float gridScale = 1.08 * l;
              float depthRefr = 0.30 + 0.16 * l;
              vec2 lPos = worldXZ + refrOffset * depthRefr;
              float t = iTime * (0.075 / l);
              vec2 fuv = lPos * gridScale + vec2(t, cos(t * 0.4) * 0.45) + vec2(l * 2.13, -l * 1.47);
              vec2 id = floor(fuv);
              vec2 f = fract(fuv) - 0.5;

              float r = iTime * (runeHash(id) - 0.5) * 0.48 + runeHash(id + 9.2) * TAU;
              mat2 rot = mat2(cos(r), sin(r), -sin(r), cos(r));

              float aa = clamp(worldPx * gridScale * 1.25, 0.006, 0.09);
              float lodFade = 1.0 - smoothstep(0.055, 0.09, aa);
              vec2 orb = drawFaceOrb(f * rot, id, aa) * lodFade;

              float huePick = runeHash(id + 5.4);
              // Cohesive royal cobalt -> deep sapphire -> luminous cyan-teal orb palette
              vec3 discCol = mix(vec3(0.05, 0.13, 0.58), vec3(0.05, 0.34, 0.66), huePick);
              vec3 featCol = mix(vec3(0.14, 0.36, 1.00), vec3(0.16, 0.78, 0.95), huePick);
              float presence = mix(0.42, 1.0, smoothstep(0.05, 0.85, sin(iTime * 0.55 + runeHash(id) * TAU) * 0.5 + 0.5));
              float depthFade = 1.0 / (0.76 + 0.36 * l);

              // Extra fine stardust glinting inside each translucent orb
              float orbDust = starDustLayer(lPos + vec2(l * 0.3), 7.5 + l * 3.0, worldPx, 91.0 + l * 13.0);
              orbsCol += (discCol * orb.x + featCol * orb.y * 0.86 + vec3(0.20, 0.65, 1.0) * orbDust * orb.x * 1.35)
                       * presence * depthFade;
            }

            // --- Layer 4: Delicate 5-segment angular stroke runes scaled cleanly for both wide & close-up views ---
            vec3 runesCol = vec3(0.0);
            for (float l = 1.0; l <= 2.0; l++) {
              float gridScale = l < 1.5 ? 2.25 : 3.65;
              vec2 rPos = worldXZ + refrOffset * (0.36 + 0.16 * l);
              float t = iTime * (0.028 / l);
              vec2 ruv = rPos * gridScale + vec2(t + l * 1.7, sin(t * 0.5) * 0.45);
              vec2 id = floor(ruv);
              vec2 f = fract(ruv) - 0.5;

              // Leave generous dark nebula breathing room between runes (~68% cell occupancy)
              float occupied = step(0.32, runeHash(id + 33.1 + l * 7.0));
              float aa = clamp(worldPx * gridScale * 1.25, 0.005, 0.085);
              float lodFade = 1.0 - smoothstep(0.05, 0.085, aa);
              float blink = mix(0.30, 1.0, smoothstep(0.15, 0.85, sin(iTime * 0.62 + runeHash(id) * TAU) * 0.5 + 0.5));
              vec2 rune = drawRune(f, id, aa) * blink * lodFade * occupied;

              // Predominantly vivid emerald / acid-green runes with occasional electric cobalt runes
              float isBlue = step(0.68, runeHash(id + 14.2));
              vec3 greenCore = vec3(0.12, 0.96, 0.38);
              vec3 blueCore  = vec3(0.10, 0.38, 1.00);
              vec3 rCore = mix(greenCore, blueCore, isBlue);
              vec3 rGlow = mix(vec3(0.04, 0.52, 0.20), vec3(0.04, 0.18, 0.72), isBlue);
              float layerW = l < 1.5 ? 0.88 : 0.55;
              runesCol += (rCore * rune.x + rGlow * rune.y * 0.48) * layerW;
            }

            vec3 srgb = nebula + (orbsCol + runesCol) * radialFade;
            srgb = tanh(srgb * 1.18);

            // Subtle chromatic shimmer across refracted ripples
            float ab = 0.004 * length(uvNeb) + 0.045 * length(refrOffset);
            srgb.g = tanh(srgb.g + ab * 0.75);
            srgb.b = tanh(srgb.b + ab * 1.15);

            // Convert display-tuned cosmic palette to linear space so deep obsidian blacks stay rich after tonemapping
            return pow(clamp(srgb, 0.0, 1.0), vec3(2.2)) * 1.38;
          }

          float shell(vec2 ry,float a,float R,float lip,float n){
            float f=cos(a*n),g=cos(a*n*2.);
            float rr=R+.029*f;
            float x=min(1.13,ry.x/rr);
            float bowl=lip-R*(.19*(1.-x*x*x*x))+.022*f*x*x;
            float d=max((abs(ry.y-bowl+.029)-.041)*.68,ry.x-rr);
            return min(d,bead(ry,rr-.013,lip-.018+.018*f,.035+.004*g));
          }

          float fountain(vec3 p,vec2 ry,float a){
            float y=p.y,r=ry.x;
            float base=min(drum(ry,.367,.405,.060),drum(ry,.454,.313,.058));
            base=min(base,bead(ry,.30,.486,.039));
            float flutes=.010*cos(a*12.)*smoothstep(.49,.60,y)*(1.-smoothstep(.83,.94,y));
            float radius=.143+.105*exp(-sq((y-.55)/.15))+.052*exp(-sq((y-.94)/.105))+flutes;
            float stem=max((r-radius)*.73,max(.45-y,y-1.035));
            base=min(base,min(stem,bead(ry,.185,.925,.028)));
            float neck=.085+.059*exp(-sq((y-1.23)/.085))+.055*exp(-sq((y-1.82)/.12));
            base=min(base,max((r-neck)*.72,max(1.04-y,y-1.947)));
            base=min(base,min(bead(ry,.127,1.33,.025),bead(ry,.109,1.68,.024)));
            base=min(base,drum(ry,2.094,.083,.139));
            base=min(base,min(bead(ry,.114,2.071,.024),bead(ry,.081,2.198,.030)));
            base=min(base,oval(p-vec3(0,2.232,0),vec3(.069,.053,.069)));
            if(r<LOWER_R+.35 && abs(y-LOWER_Y)<.55)base=min(base,shell(ry,a,LOWER_R,LOWER_Y,16.));
            else base=min(base,max(r-LOWER_R-.05,abs(y-LOWER_Y)-.31));
            if(r<UPPER_R+.25 && abs(y-UPPER_Y)<.45)base=min(base,shell(ry,a,UPPER_R,UPPER_Y,13.));
            else base=min(base,max(r-UPPER_R-.05,abs(y-UPPER_Y)-.20));
            return base;
          }

          vec2 mapScene(vec3 p){
            float r=length(p.xz);
            float a=atan(p.z,p.x+1e-7);
            vec2 ry=vec2(r,p.y),d=vec2(FAR,0.);

            float rim=min(bead(ry,2.177,.383,.076),bead(ry,2.208,.137,.046));
            rim=min(rim,box2(ry-vec2(2.174,.232),vec2(.095,.13)));
            pick(d,rim,2.);

            if(r<1.66 && p.y<2.75)pick(d,fountain(p,ry,a),1.);
            else pick(d,max(r-1.23,p.y-2.30),0.);

            return d;
          }

          vec2 trace(vec3 ro,vec3 rd,float limit){
            float t=.025;
            for(int i=0;i<142;i++){
              if(t>=limit)break;
              vec2 h=mapScene(ro+rd*t);
              float e=.00063+.00012*t;
              if(h.x<e && h.y>0.)return vec2(t,h.y);
              t+=max(h.x*.90,.008);
            }
            return vec2(limit,0.);
          }

          vec3 normalAt(vec3 p,float t){
            vec2 e=vec2(1,-1)*(.00135+.000085*t);
            return normalize(e.xyy*mapScene(p+e.xyy).x+e.yyx*mapScene(p+e.yyx).x+
                             e.yxy*mapScene(p+e.yxy).x+e.xxx*mapScene(p+e.xxx).x);
          }

          float shadowAt(vec3 p,vec3 n){
            float s=1.,t=.034;
            vec3 start=p+.007*n;
            for(int i=0;i<(QUALITY==1?33:21);i++){
              vec2 h=mapScene(start+SUN*t);
              if(h.y>0.)s=min(s,12.*h.x/t);
              if(s<.045 || t>6.4)break;
              t+=clamp(h.x,.022,.52);
            }
            return sat(s);
          }

          vec3 environment(vec3 d){
            float y=max(0.,d.y),sun=max(0.,dot(d,SUN));
            vec3 crystalSky=mix(vec3(.68,.78,.96),vec3(.34,.56,.88),smoothstep(0.,.87,y));
            vec3 dreamySky=mix(vec3(.78,.74,.97),vec3(.48,.62,.92),smoothstep(0.,.87,y));
            vec3 c=mix(crystalSky,dreamySky,uLavenderTint);
            vec2 uv=d.xz/(.29+abs(d.y));
            float veil=smoothstep(.48,.74,fbm(uv*2.1+vec2(iTime*.012,0.)));
            c=mix(c,mix(vec3(.88,.94,1.0),vec3(.93,.89,1.0),uLavenderTint),.37*veil*smoothstep(0.,.38,y));
            c+=mix(vec3(.75,.90,1.0),vec3(.90,.78,1.0),uLavenderTint)*(.30*pow(sun,10.)+1.2*pow(sun,125.));
            return c;
          }

          vec3 groundColor(vec3 p,float t,out vec3 n){
            float f=fbm(p.xz*2.5);
            float textureDetail=noise2(p.xz*98.);
            float detail=mix(textureDetail,.5,smoothstep(10.,29.,t));
            vec3 warmGrass=mix(vec3(.029,.073,.013),vec3(.130,.229,.047),f)*(.66+.75*detail);
            vec3 dreamyGrass=mix(vec3(.045,.105,.095),vec3(.14,.28,.22),f)*(.68+.75*detail);
            vec3 grass=mix(warmGrass,dreamyGrass,uLavenderTint*.65);
            float blade=sin(145.*p.x+45.*p.z+3.*noise2(p.xz*21.)+.22*sin(iTime*2.+p.z))*sin(p.z*159.-38.*p.x);
            grass+=vec3(.046,.063,.012)*max(0.,blade)*smoothstep(.38,.73,f)*(1.-smoothstep(8.,22.,t));
            float r=length(p.xz);
            grass*=mix(.72,1.0,smoothstep(2.20,2.45,r));
            n=normalize(vec3((noise2(p.xz*52.+vec2(.23,0.))-textureDetail)*.25,1.,
                             (noise2(p.xz*52.+vec2(0,.23))-textureDetail)*.25));
            return grass;
          }

          vec3 surface(vec3 p,vec3 n,vec3 rd,float m,float t,bool simple){
            float grain=noise2(p.xz*74.+p.y*vec2(26.,-29.));
            vec3 c=WHITE;
            float shine=.12, rough=31.;
            if(m<.5)c=groundColor(p,t,n);
            else if(m<3.5){
              float f=fbm(p.xz*7.+p.y*vec2(6.,-8.));
              float vein=pow(.5+.5*sin(15.*p.x+9.*p.z+10.*f+9.*p.y),15.);
              vec3 warmStone=mix(vec3(.52,.45,.36),vec3(.94,.85,.72),f)-vec3(.16,.12,.09)*vein;
              vec3 pearlStone=mix(vec3(.56,.54,.72),vec3(.92,.90,.98),f)-vec3(.12,.11,.18)*vein;
              c=mix(warmStone,pearlStone,uLavenderTint*.78);
              if(m>1.5 && m<2.5){
                float a=atan(p.z,p.x+1e-6),r=length(p.xz);
                float grout=1.-smoothstep(.005,.021,abs(fract(a*52./TAU+.5)-.5));
                c*=mix(.77,1.,hash11(floor(a*52./TAU+.5)+17.))*(1.-.31*grout*smoothstep(2.12,2.25,r));
              }
              c*=.87+.24*grain;
            }
            float ndl=max(0.,dot(n,SUN));
            float sh=simple?1.:(ndl>.005?shadowAt(p,n):0.);
            float contact=1.;
            if(!simple){
              float h=mapScene(p+.085*n).x;
              contact=mix(.69,1.,smoothstep(.005,.083,h));
            }
            float hemi=.30+.24*max(0.,n.y);
            float spec=pow(max(0.,dot(n,normalize(SUN-rd))),rough)*shine*sh;
            vec3 sunTint=mix(vec3(1.22,.98,.72),vec3(1.12,.96,1.18),uLavenderTint*.65);
            vec3 col=c*(hemi*vec3(.76,.86,1.03)*contact+1.33*ndl*sh*sunTint)+vec3(1.,.85,.75)*spec;

            float shellGlow = exp(-abs(p.y - UPPER_Y) * 6.5) * smoothstep(UPPER_R + 0.1, UPPER_R - 0.15, length(p.xz))
                            + exp(-abs(p.y - LOWER_Y) * 5.5) * smoothstep(LOWER_R + 0.1, LOWER_R - 0.20, length(p.xz));
            col += vec3(0.56, 0.64, 0.94) * shellGlow * (0.06 + uSurgeGlow * 0.26);
            return col;
          }

          float fetchWave(vec2 p){
            ivec2 dim=textureSize(iChannel0,0);
            int n=waveSize(vec2(dim));
            if(n<16)return 0.;
            vec2 q=clamp((p/WAVE_DOMAIN*.5+.5)*float(n)-.5,vec2(0.),vec2(float(n)-2.01));
            ivec2 b=ivec2(q);
            vec2 f=fract(q);
            f=f*f*(3.-2.*f);
            return mix(mix(texelFetch(iChannel0,b,0).r,texelFetch(iChannel0,b+ivec2(1,0),0).r,f.x),
                       mix(texelFetch(iChannel0,b+ivec2(0,1),0).r,texelFetch(iChannel0,b+ivec2(1,1),0).r,f.x),f.y);
          }

          // Multi-scale organic liquid swells & micro-ripples (lively water motion without linear stripe patterns)
          float windWaves(vec2 p,float tier){
            float t=iTime*.82;
            float freq=tier>0.?3.1:2.05;
            vec2 warp=vec2(
              noise2(p*1.45+vec2(t*.46,-t*.34)),
              noise2(p*1.45+vec2(-t*.38,t*.44)+7.3)
            )-.5;
            vec2 q=p+warp*.24;
            float swell=fbm(q*freq+vec2(t*.52,-t*.40));
            float chop=noise2(q*(freq*2.35)+vec2(-t*1.12,t*.96)+11.4);
            float amp=tier>0.?.032:.026;
            return (swell*.70+chop*.30-.5)*amp;
          }

          vec3 lilyPads(vec3 water,vec2 q,float r,float shadow){
            if(r<0.42 || r>2.10)return water;
            for(int i=0;i<12;i++){
              vec4 pad=uLilyPads[i];
              vec2 dRaw=q-pad.xy;
              float leafR=abs(pad.z);
              if(dot(dRaw,dRaw)>sq(leafR*1.38))continue;

              float fi=float(i);
              vec2 d=rotateXZ(dRaw,pad.w);
              float len=length(d),ang=atan(d.y,d.x+1e-6);
              float edge=len-(leafR+.006*cos(ang*5.));
              edge=max(edge,min(-d.x,.38*d.x-abs(d.y)));
              float leaf=1.-smoothstep(-.007,.008,edge);
              if(leaf<=0.001)continue;

              float vein=pow(.5+.5*cos(ang*14.+8.*len),11.);
              vec3 green=mix(vec3(.040,.138,.044),vec3(.122,.299,.091),noise2(d*33.+fi*3.7))*(.70+.66*shadow);
              green+=vec3(.066,.101,.024)*vein;
              water=mix(water,green,leaf);

              if(pad.z<0.){
                float fr=leafR*.44+.010*cos(ang*8.);
                float petal=(1.-smoothstep(fr-.006,fr+.006,len))*(.72+.28*cos(ang*8.));
                vec3 pink=mix(vec3(.73,.30,.44),vec3(.96,.71,.70),smoothstep(.015,fr,len));
                water=mix(water,pink*(.65+.44*shadow),petal);
                water=mix(water,vec3(.83,.54,.22),1.-smoothstep(.009,.016,len));
              }
            }
            return water;
          }

          vec3 shadeWater(vec3 p,vec3 rd,float tier,float hitDist){
            vec2 q=p.xz,ex=vec2(.032,0.);
            float hx=(windWaves(q+ex.xy,tier)-windWaves(q-ex.xy,tier))*.5;
            float hz=(windWaves(q+ex.yx,tier)-windWaves(q-ex.yx,tier))*.5;
            vec2 slope=vec2(-hx,-hz)*(1.35/ex.x);
            if(tier==0.){
              vec2 ew=vec2(.036,0.);
              float whx=(fetchWave(q+ew.xy)-fetchWave(q-ew.xy))*.5;
              float whz=(fetchWave(q+ew.yx)-fetchWave(q-ew.yx))*.5;
              slope+=vec2(-whx,-whz)*(.48/ew.x);
            }
            // Natural liquid wave slope limit (~21 deg max): dynamic glossy undulation with zero grazing artifacts
            float slopeLen=length(slope);
            if(slopeLen>.38) slope*=.38/slopeLen;
            vec3 n=normalize(vec3(slope.x,1.,slope.y));
            float r=length(q);
            float depth=tier==0.?mix(.28,.115,smoothstep(1.82,2.12,r)):.105*(1.-.55*smoothstep(.2,.87,r));
            vec3 refr=refract(rd,n,1./1.333);
            vec2 refrOffset = refr.xz * depth / max(.3, -refr.y);
            vec2 b = q + refrOffset;

            float joints=max(abs(fract(b.x*5.)-.5),abs(fract(b.y*5.)-.5));
            float tiles=(1.-.35*smoothstep(.452,.498,joints))*(.69+.35*hash21(floor(b*5.)));
            vec3 sand=tier==0.?mix(vec3(.072,.203,.182),vec3(.150,.373,.305),smoothstep(.36,1.95,r))*tiles:
                               vec3(.34,.51,.46);
            float shadow=shadowAt(p,vec3(0,1,0));
            vec3 classicPool = sand*(.65+.64*shadow);

            // Luminous procedural face, rune & fractal gas water texture without linear caustic lines
            vec3 cosmicWater = evalShadertoyWater(q, refrOffset, tier, hitDist, abs(rd.y));
            cosmicWater *= (0.84 + 0.16 * shadow);

            float abyssMix = sat(uLavenderTint);
            vec3 body = mix(classicPool, cosmicWater, abyssMix);

            vec3 refl=reflect(rd,n);
            vec3 reflected=environment(refl);
            float nearT=max(.05,-dot(q,refl.xz)/max(.001,dot(refl.xz,refl.xz)));
            if(QUALITY==1 && refl.y>-.02 && length(q+nearT*refl.xz)<1.19 && tier==0.){
              vec3 org=p+.018*vec3(0,1,0);
              vec2 h=trace(org,refl,5.0);
              if(h.y>.5) {
                vec3 pos=org+refl*h.x;
                reflected=surface(pos,normalAt(pos,h.x),refl,h.y,h.x,true)*.84;
              }
            }
            float ndv=sat(dot(-rd,n));
            float fres=.028+.972*pow(1.-ndv,4.2);
            vec3 halfVec=normalize(SUN-rd);
            float ndh=sat(dot(n,halfVec));
            float specTight=pow(ndh,145.)*1.25;
            float specBroad=pow(ndh,26.)*0.16;
            float waveCrest=smoothstep(0.08,0.34,length(slope));

            // Clear dark-water Fresnel: keep abyssal obsidian-teal depth rich while glossy moving wave crests & glints ride on top
            vec3 tintedRefl = reflected * mix(vec3(1.0), vec3(0.46, 0.64, 0.84), abyssMix);
            float reflMix = clamp(fres * mix(0.85, 0.28, abyssMix) + waveCrest * 0.085 + 0.015, 0., 0.48);
            vec3 outC = mix(body, tintedRefl, reflMix)
                      + vec3(0.86, 0.98, 1.15) * (specTight + specBroad) * (0.38 + 0.62 * shadow);

            if (abyssMix > 0.01) {
              vec2 localUV;
              vec2 uvMin, uvMax;
              if (tier < 0.5) {
                vec2 norm = q / (2.0 * WAVE_DOMAIN) + 0.5;
                localUV = vec2(norm.x * 0.5, norm.y);
                uvMin = vec2(0.002, 0.002);
                uvMax = vec2(0.498, 0.998);
              } else if (tier < 1.5) {
                vec2 norm = q / (2.0 * 1.18) + 0.5;
                localUV = vec2(0.5 + norm.x * 0.25, norm.y * 0.5);
                uvMin = vec2(0.502, 0.002);
                uvMax = vec2(0.748, 0.498);
              } else {
                vec2 norm = q / (2.0 * 0.68) + 0.5;
                localUV = vec2(0.75 + norm.x * 0.25, norm.y * 0.5);
                uvMin = vec2(0.752, 0.002);
                uvMax = vec2(0.998, 0.498);
              }
              vec2 duckUV = clamp(localUV, uvMin, uvMax);
              vec4 duck = texture(uDuckweedTex, duckUV);
              // Crisp alpha response without bloating fine glyph strokes
              float duckAlpha = smoothstep(0.14, 0.84, duck.a) * abyssMix;
              vec4 duckShadow = texture(uDuckweedTex, clamp(localUV - vec2(0.0014, 0.0024), uvMin, uvMax));
              outC *= 1.0 - smoothstep(0.18, 0.78, duckShadow.a) * 0.34 * abyssMix;
              vec3 duckLit = duck.rgb * (1.10 + 0.16 * shadow);
