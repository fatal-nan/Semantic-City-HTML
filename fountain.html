          for (let k = 0; k < numStreams; k++) {
            const nz = nozzles[k];
            const word = nz.word;
            for (let c = 0; c < word.length; c++) {
              const ch = word[c];
              const ang = nz.baseAngle + Math.sin(c * 0.25 + k) * 0.06;
              const ax = Math.cos(ang), az = Math.sin(ang);
              const isMidTier = k % 2 === 1;
              const tSim = c * 0.08 + 0.05;
              const vr = isMidTier ? 0.55 : 0.48;
              const vy0 = isMidTier ? 0.25 : 2.55;
              const r0 = isMidTier ? UPPER_R + 0.02 : 0.036;
              const y0 = isMidTier ? UPPER_Y + 0.02 : NOZZLE_Y;

              travelers.push({
                ch,
                styleIdx: nz.styleIdx,
                stage: isMidTier ? 1 : 0,
                bouncedInStage: false,
                x: ax * (r0 + vr * tSim),
                y: y0 + vy0 * tSim - 0.5 * GRAVITY * tSim * tSim,
                z: az * (r0 + vr * tSim),
                vx: ax * vr,
                vy: vy0 - GRAVITY * tSim,
                vz: az * vr,
                ax,
                az,
                squashTimer: 0,
                spin: 0,
                spinVel: 0,
                size: 15.2,
                age: tSim,
                maxAge: 6.5
              });
            }
          }
        }

        function emitNextWordChar(nz, time) {
          if (travelers.length > 260) {
            travelers.shift();
          }

          const idx = nz.word.length - 1 - nz.charCursor;
          const ch = nz.word[idx];

          const sway = Math.sin(time * 1.8 + nz.swayPhase) * 0.07;
          const ang = nz.baseAngle + sway;
          const ax = Math.cos(ang), az = Math.sin(ang);

          const vr = 0.48 + 0.05 * Math.cos(time * 1.5 + nz.id);
          const vy = 2.62 + 0.12 * Math.sin(time * 2.1 + nz.id);

          travelers.push({
            ch,
            styleIdx: nz.styleIdx,
            stage: 0,
            bouncedInStage: false,
            x: ax * 0.036,
            y: NOZZLE_Y,
            z: az * 0.036,
            vx: ax * vr,
            vy,
            vz: az * vr,
            ax,
            az,
            squashTimer: 0,
            spin: 0,
            spinVel: 0,
            size: 15.5,
            age: 0,
            maxAge: 7.0
          });

          nz.charCursor++;
          if (nz.charCursor >= nz.word.length) {
            nz.charCursor = 0;
            nz.pauseTimer = nz.wordGap;
            const nextWordIdx = Math.floor(Math.random() * wordBank.length);
            nz.word = wordBank[nextWordIdx];
            nz.styleIdx = 1 + (nz.styleIdx % 3);
          } else {
            nz.pauseTimer = nz.charInterval;
          }
        }

        function stepFluidAndDuckweedPhysics(dt, time, simTime) {
          const simDt = Math.min(0.025, dt * 0.46 * lcState.flowSpeed);
          const bounce = lcState.bounceElasticity;
          const sizeScale = lcState.fontSizeScale;

          for (let i = 0; i < nozzles.length; i++) {
            const nz = nozzles[i];
            nz.pauseTimer -= simDt;
            if (nz.pauseTimer <= 0) {
              emitNextWordChar(nz, time);
            }
          }

          for (let i = travelers.length - 1; i >= 0; i--) {
            const p = travelers[i];
            p.age += simDt;
            if (p.age >= p.maxAge) {
              travelers.splice(i, 1);
              continue;
            }
            if (p.squashTimer > 0) p.squashTimer = Math.max(0, p.squashTimer - simDt * 2.0);

            p.x += p.vx * simDt;
            p.y += p.vy * simDt;
            p.z += p.vz * simDt;
            p.vy -= GRAVITY * simDt;
            p.spin += p.spinVel * simDt;

            const r = Math.hypot(p.x, p.z) || 0.001;
            const nx = p.x / r, nz = p.z / r;

            if (p.stage === 0) {
              if (r > UPPER_R + 0.04 && p.y < UPPER_W + 0.05) {
                p.stage = 1;
                p.bouncedInStage = false;
              } else if (p.vy < 0 && p.y <= UPPER_W + 0.02 && r <= UPPER_R + 0.06) {
                p.y = UPPER_W + 0.02;
                p.squashTimer = 0.15;
                for (let d = 0; d < duckweeds.length; d++) {
                  const dw = duckweeds[d];
                  if (dw.tier !== 2) continue;
                  const dx = dw.x - p.x, dz = dw.z - p.z;
                  const dist2 = dx * dx + dz * dz;
                  if (dist2 < 0.06 && dist2 > 1e-6) {
                    const dist = Math.sqrt(dist2);
                    const imp = ((0.24 - dist) / 0.24) * 0.55 * bounce;
                    dw.vx += (dx / dist) * imp;
                    dw.vz += (dz / dist) * imp;
                    dw.wanderAng = Math.atan2(dw.vz, dw.vx);
                    dw.bumpGlow = 0.9;
                  }
                }
                if (!p.bouncedInStage) {
                  p.bouncedInStage = true;
                  p.vy = (0.68 + Math.random() * 0.22) * bounce;
                  const slideSpd = 0.62 + Math.random() * 0.14;
                  p.vx = nx * slideSpd;
                  p.vz = nz * slideSpd;
                  p.spinVel = (Math.random() - 0.5) * 3.0;
                  if (Math.random() < 0.3 && impactRings.length < 28) {
                    impactRings.push({ x: p.x, y: UPPER_W + 0.01, z: p.z, r: 0.02, maxR: 0.15, alpha: 0.75, styleIdx: p.styleIdx });
                  }
                } else if (r < UPPER_R - 0.03) {
                  p.vy = (0.22 + Math.random() * 0.12) * bounce;
                  const rimGlide = 0.68 + Math.random() * 0.12;
                  p.vx = nx * rimGlide;
                  p.vz = nz * rimGlide;
                } else {
                  p.stage = 1;
                  p.bouncedInStage = false;
                  const spillSpd = 0.56 + Math.random() * 0.12;
                  p.vx = nx * spillSpd;
                  p.vz = nz * spillSpd;
                  p.vy = 0.16;
                  p.spin = 0;
                  p.spinVel = 0;
                }
              }
            }

            if (p.stage === 1) {
              if (r > LOWER_R + 0.05 && p.y < LOWER_W + 0.05) {
                p.stage = 2;
                p.bouncedInStage = false;
              } else if (p.vy < 0 && p.y <= LOWER_W + 0.025 && r <= LOWER_R + 0.06) {
                p.y = LOWER_W + 0.025;
                p.squashTimer = 0.15;
                for (let d = 0; d < duckweeds.length; d++) {
                  const dw = duckweeds[d];
                  if (dw.tier !== 1) continue;
                  const dx = dw.x - p.x, dz = dw.z - p.z;
                  const dist2 = dx * dx + dz * dz;
                  if (dist2 < 0.09 && dist2 > 1e-6) {
                    const dist = Math.sqrt(dist2);
                    const imp = ((0.30 - dist) / 0.30) * 0.68 * bounce;
                    dw.vx += (dx / dist) * imp;
                    dw.vz += (dz / dist) * imp;
                    dw.wanderAng = Math.atan2(dw.vz, dw.vx);
                    dw.bumpGlow = 0.9;
                  }
                }
                if (!p.bouncedInStage) {
                  p.bouncedInStage = true;
                  p.vy = (0.78 + Math.random() * 0.28) * bounce;
                  const slideSpd = 0.75 + Math.random() * 0.18;
                  const fanAng = Math.atan2(nz, nx) + (Math.random() - 0.5) * 0.22;
                  p.vx = Math.cos(fanAng) * slideSpd;
                  p.vz = Math.sin(fanAng) * slideSpd;
                  p.spinVel = (Math.random() - 0.5) * 3.5;
                  if (Math.random() < 0.35 && impactRings.length < 28) {
                    impactRings.push({ x: p.x, y: LOWER_W + 0.01, z: p.z, r: 0.02, maxR: 0.20, alpha: 0.78, styleIdx: p.styleIdx });
                  }
                } else if (r < LOWER_R - 0.04) {
                  p.vy = (0.25 + Math.random() * 0.14) * bounce;
                  const rimGlide = 0.76 + Math.random() * 0.14;
                  p.vx = nx * rimGlide;
                  p.vz = nz * rimGlide;
                } else {
                  p.stage = 2;
                  p.bouncedInStage = false;
                  const cascadeSpd = 0.68 + Math.random() * 0.16;
                  p.vx = nx * cascadeSpd;
                  p.vz = nz * cascadeSpd;
                  p.vy = 0.20;
                  p.spin = 0;
                  p.spinVel = 0;
                }
              }
            }

            if (p.y <= POOL_Y + 0.015) {
              p.y = POOL_Y + 0.015;
              p.squashTimer = 0.16;
              if (!p.bouncedInStage && Math.random() < 0.45) {
                p.bouncedInStage = true;
                p.stage = 2;
                p.vy = (0.72 + Math.random() * 0.38) * bounce;
                const splashAng = Math.atan2(nz, nx) + (Math.random() - 0.5) * 0.45;
                const splashSpd = 0.42 + Math.random() * 0.22;
                p.vx = Math.cos(splashAng) * splashSpd;
                p.vz = Math.sin(splashAng) * splashSpd;
                p.spinVel = (Math.random() - 0.5) * 4.5;
                if (impactRings.length < 28) {
                  impactRings.push({ x: p.x, y: POOL_Y + 0.008, z: p.z, r: 0.025, maxR: 0.26, alpha: 0.82, styleIdx: p.styleIdx });
                }
              } else {
                for (let d = 0; d < duckweeds.length; d++) {
                  const dw = duckweeds[d];
                  if (dw.tier !== 0) continue;
                  const dx = dw.x - p.x;
                  const dz = dw.z - p.z;
                  const dist2 = dx * dx + dz * dz;
                  if (dist2 < 0.12 && dist2 > 1e-5) {
                    const dist = Math.sqrt(dist2);
                    const impulse = ((0.34 - dist) / 0.34) * 0.36 * bounce;
                    dw.vx += (dx / dist) * impulse;
                    dw.vz += (dz / dist) * impulse;
                    dw.bumpGlow = 0.6;
                  }
                }

                if (r < 1.96 && duckweeds.length < 310) {
                  const wAng = Math.atan2(p.vz, p.vx) + (Math.random() - 0.5) * 0.8;
                  duckweeds.push({
                    tier: 0,
                    kind: "letter",
                    stampIdx: 0,
                    ch: p.ch,
                    styleIdx: p.styleIdx,
                    x: p.x,
                    z: p.z,
                    vx: Math.cos(wAng) * 0.24,
                    vz: Math.sin(wAng) * 0.24,
                    wanderAng: wAng,
                    wanderSpd: 0.20,
                    radius: 0.044,
                    angle: (Math.random() - 0.5) * 0.7,
                    omega: (Math.random() - 0.5) * 0.12,
                    hue: 0.5,
                    colorMain: "#fff",
                    colorGlow: "#9cf",
                    eyeDist: 0,
                    eyeSize: 0,
                    phase: Math.random() * TAU,
                    bumpGlow: 0.5,
                    temporary: true,
                    age: 0,
                    maxAge: 4.8 + Math.random() * 2.0
                  });
                }
                travelers.splice(i, 1);
              }
            }
          }

          for (let i = 0; i < lilyPads.length; i++) {
            const lp = lilyPads[i];
            lp.wanderAng += Math.sin(time * 0.32 + lp.phase) * 0.45 * simDt;
            const swirlX = Math.sin(lp.z * 1.8 + time * 0.25) * 0.04;
            const swirlZ = Math.cos(lp.x * 1.8 - time * 0.22) * 0.04;
            const tvx = Math.cos(lp.wanderAng) * lp.wanderSpd + swirlX;
            const tvz = Math.sin(lp.wanderAng) * lp.wanderSpd + swirlZ;
            lp.vx += (tvx - lp.vx) * 1.5 * simDt;
            lp.vz += (tvz - lp.vz) * 1.5 * simDt;

            for (let j = i + 1; j < lilyPads.length; j++) {
              const other = lilyPads[j];
              const dx = other.x - lp.x;
              const dz = other.z - lp.z;
              const d = Math.hypot(dx, dz) || 0.001;
              const minD = lp.radius + other.radius + 0.08;
              if (d < minD) {
                const nx = dx / d, nz = dz / d;
                const push = (minD - d) * 1.8 * simDt;
                lp.vx -= nx * push;
                lp.vz -= nz * push;
                other.vx += nx * push;
                other.vz += nz * push;
              }
            }

            lp.x += lp.vx * simDt;
            lp.z += lp.vz * simDt;
            lp.angle += Math.sin(time * 0.45 + lp.phase) * 0.08 * simDt;

            const r = Math.hypot(lp.x, lp.z) || 0.001;
            const nx = lp.x / r, nz = lp.z / r;
            const minR = 0.54 + lp.radius;
            const maxR = 1.98 - lp.radius;
            if (r < minR) {
              lp.x = nx * minR;
              lp.z = nz * minR;
              lp.vx += nx * 0.08;
              lp.vz += nz * 0.08;
              lp.wanderAng = Math.atan2(lp.vz, lp.vx);
            } else if (r > maxR) {
              lp.x = nx * maxR;
              lp.z = nz * maxR;
              lp.vx -= nx * 0.08;
              lp.vz -= nz * 0.08;
              lp.wanderAng = Math.atan2(lp.vz, lp.vx);
            }

            const base = i * 4;
            lilyPadUniformData[base] = lp.x;
            lilyPadUniformData[base + 1] = lp.z;
            lilyPadUniformData[base + 2] = lp.hasFlower ? -lp.radius : lp.radius;
            lilyPadUniformData[base + 3] = lp.angle;
          }

          for (let tier = 0; tier < 3; tier++) {
            const impacts = tierSpillImpacts[tier];
            const pushRange = tier === 0 ? 0.26 : tier === 1 ? 0.18 : 0.14;
            const pushR2 = pushRange * pushRange;
            for (let k = 0; k < impacts.length; k++) {
              const sp = impacts[k];
              const impAge = (simTime + sp.offset - sp.flight) % sp.period;
              if (impAge < 0 || impAge > 0.22) continue;
              for (let i = 0; i < duckweeds.length; i++) {
                const dw = duckweeds[i];
                if (dw.tier !== tier) continue;
                const dx = dw.x - sp.x;
                const dz = dw.z - sp.z;
                const d2 = dx * dx + dz * dz;
                if (d2 < pushR2 && d2 > 1e-6) {
                  const d = Math.sqrt(d2);
                  const push = ((pushRange - d) / pushRange) * 0.85 * simDt * bounce;
                  dw.vx += (dx / d) * push;
                  dw.vz += (dz / d) * push;
                }
              }
            }
          }

          const nDuck = duckweeds.length;
          const springStiff = 9.5 * bounce;

          for (let i = 0; i < nDuck; i++) {
            const a = duckweeds[i];
            for (let j = i + 1; j < nDuck; j++) {
              const b = duckweeds[j];
              if (a.tier !== b.tier) continue;

              const dx = b.x - a.x;
              const dz = b.z - a.z;
              const d2 = dx * dx + dz * dz;
              const minDist = (a.radius + b.radius) * sizeScale * 1.08;

              if (d2 < minDist * minDist && d2 > 1e-7) {
                const d = Math.sqrt(d2);
                const nx = dx / d;
                const nz = dz / d;
                const overlap = minDist - d;

                const softCorr = overlap * 0.18;
                a.x -= nx * softCorr;
                a.z -= nz * softCorr;
                b.x += nx * softCorr;
                b.z += nz * softCorr;

                const rvx = b.vx - a.vx;
                const rvz = b.vz - a.vz;
                const velAlongNormal = rvx * nx + rvz * nz;

                const repulse = overlap * springStiff * simDt;
                const damp = velAlongNormal < 0 ? -velAlongNormal * 0.42 : 0;
                const totalImp = repulse + damp;

                a.vx -= nx * totalImp;
                a.vz -= nz * totalImp;
                b.vx += nx * totalImp;
                b.vz += nz * totalImp;

                a.wanderAng = Math.atan2(a.vz, a.vx);
                b.wanderAng = Math.atan2(b.vz, b.vx);
              }
            }
          }

          for (let i = 0; i < nDuck; i++) {
            const dw = duckweeds[i];
            if (dw.tier !== 0) continue;
            for (let l = 0; l < lilyPads.length; l++) {
              const lp = lilyPads[l];
              const dx = dw.x - lp.x;
              const dz = dw.z - lp.z;
              const d2 = dx * dx + dz * dz;
              const minD = lp.radius + dw.radius * sizeScale * 0.92;
              if (d2 < minD * minD && d2 > 1e-7) {
                const d = Math.sqrt(d2);
                const nx = dx / d, nz = dz / d;
                const overlap = minD - d;
                dw.x += nx * overlap * 0.35;
                dw.z += nz * overlap * 0.35;
                const vn = (dw.vx - lp.vx) * nx + (dw.vz - lp.vz) * nz;
                if (vn < 0) {
                  dw.vx -= nx * vn * 1.15;
                  dw.vz -= nz * vn * 1.15;
                  dw.wanderAng = Math.atan2(dw.vz, dw.vx);
                }
              }
            }
          }

          const angDrag = Math.pow(0.06, simDt);

          for (let i = nDuck - 1; i >= 0; i--) {
            const dw = duckweeds[i];
            if (dw.temporary) {
              dw.age += simDt;
              if (dw.age >= dw.maxAge) {
                duckweeds.splice(i, 1);
                continue;
              }
            }
            if (dw.bumpGlow > 0) dw.bumpGlow = Math.max(0, dw.bumpGlow - simDt * 2.0);

            const cfg = TIER_CONFIGS[dw.tier];
            const smoothTurn =
              Math.sin(time * 0.55 + dw.phase) * 0.75 +
              Math.cos(time * 0.31 + dw.phase * 2.3) * 0.55;
            dw.wanderAng += smoothTurn * simDt;

            const freq = dw.tier === 0 ? 2.1 : dw.tier === 1 ? 3.6 : 5.5;
            const flowX = Math.sin(dw.z * freq + time * 0.42 + dw.tier) * 0.11;
            const flowZ = Math.cos(dw.x * freq - time * 0.38 + dw.tier) * 0.11;

            const targetVx = Math.cos(dw.wanderAng) * dw.wanderSpd + flowX;
            const targetVz = Math.sin(dw.wanderAng) * dw.wanderSpd + flowZ;

            dw.vx += (targetVx - dw.vx) * 2.0 * simDt;
            dw.vz += (targetVz - dw.vz) * 2.0 * simDt;

            dw.omega *= angDrag;
            dw.x += dw.vx * simDt;
            dw.z += dw.vz * simDt;
            dw.angle += dw.omega * simDt + Math.sin(time * 0.8 + dw.phase) * 0.04 * simDt;

            const newR = Math.hypot(dw.x, dw.z) || 0.001;
            const bnx = dw.x / newR, bnz = dw.z / newR;
            const polarAng = Math.atan2(dw.z, dw.x);
            const waveMargin =
              cfg.tier === 0
                ? 0.14 * Math.sin(polarAng * 3.0 + time * 0.15) + 0.10 * Math.cos(polarAng * 5.0 - time * 0.12)
                : 0.04 * Math.sin(polarAng * 4.0 + time * 0.2);

            const minR = cfg.minR + dw.radius * sizeScale;
            const hardMaxR = cfg.maxR - dw.radius * sizeScale;
            const softOuterStart = hardMaxR - 0.18 + waveMargin;

            if (newR > softOuterStart) {
              const inwardPull = (newR - softOuterStart) * 1.45 * simDt;
              dw.vx -= bnx * inwardPull;
              dw.vz -= bnz * inwardPull;
              dw.wanderAng = Math.atan2(dw.vz, dw.vx);
            }

            if (newR < minR) {
              dw.x = bnx * minR;
              dw.z = bnz * minR;
              const dot = dw.vx * bnx + dw.vz * bnz;
              if (dot < 0) {
                dw.vx -= 1.4 * dot * bnx;
                dw.vz -= 1.4 * dot * bnz;
                dw.wanderAng = Math.atan2(dw.vz, dw.vx);
              }
            } else if (newR > hardMaxR) {
              dw.x = bnx * hardMaxR;
              dw.z = bnz * hardMaxR;
              const dot = dw.vx * bnx + dw.vz * bnz;
              if (dot > 0) {
                dw.vx -= 1.4 * dot * bnx;
                dw.vz -= 1.4 * dot * bnz;
                dw.wanderAng = Math.atan2(dw.vz, dw.vx);
              }
            }
          }
        }

        const emotionTags = ["?", "!", "…", "~", "✦", "；", "♡", "×"];
        function renderDuckweedSurfaceTexture(time) {
          duckCtx.clearRect(0, 0, DUCK_TEX_W, DUCK_TEX_H);
          const sizeScale = lcState.fontSizeScale;

          for (let i = 0; i < duckweeds.length; i++) {
            const dw = duckweeds[i];
            const cfg = TIER_CONFIGS[dw.tier];
            const worldToPx = cfg.pxSize / (2.0 * cfg.domain);
            const px = cfg.ox + (dw.x / (2.0 * cfg.domain) + 0.5) * cfg.pxSize;
            const py = cfg.oy + (dw.z / (2.0 * cfg.domain) + 0.5) * cfg.pxSize;
            const radPx = dw.radius * sizeScale * worldToPx;

            let alpha = 0.95;
            if (dw.temporary) {
              const fadeIn = Math.min(1.0, dw.age / 0.45);
              const rem = dw.maxAge - dw.age;
              const fadeOut = rem < 1.2 ? Math.max(0.0, rem / 1.2) : 1.0;
              alpha = 0.95 * fadeIn * fadeOut;
            }

            duckCtx.save();
            duckCtx.globalAlpha = alpha;
            duckCtx.translate(px, py);
            duckCtx.rotate(dw.angle);

            if (dw.kind === "rune") {
              const stamp = runeStrokeStamps[dw.stampIdx];
              const drawD = radPx * 2.55;
              duckCtx.drawImage(stamp, -drawD * 0.5, -drawD * 0.5, drawD, drawD);
            } else if (dw.kind === "face") {
              const R = radPx * 1.02;
              const blink = Math.sin(time * 1.8 + dw.phase * 3.0) > -0.82 ? 1.0 : 0.18;
              const ex = dw.eyeDist * R * 1.85;
              const ey = -0.16 * R;
              const er = dw.eyeSize * R * 1.75;

              const mouthType = Math.sin(time * 2.4 + dw.phase * 3.0);
              const mw = R * 0.46;
              const my = R * 0.22;
              const ctrlY = my + mouthType * R * 0.30;

              duckCtx.lineCap = "round";
              duckCtx.strokeStyle = "rgba(10, 14, 42, 0.78)";
              duckCtx.lineWidth = Math.max(2.6, R * 0.12);
              duckCtx.beginPath();
              duckCtx.moveTo(-mw, my);
              duckCtx.quadraticCurveTo(0, ctrlY, mw, my);
              duckCtx.stroke();

              duckCtx.fillStyle = "rgba(10, 14, 42, 0.78)";
              duckCtx.beginPath();
              duckCtx.ellipse(-ex, ey, er + 1.1, er * blink + 1.1, 0, 0, TAU);
              duckCtx.ellipse(ex, ey, er + 1.1, er * blink + 1.1, 0, 0, TAU);
              duckCtx.fill();

              duckCtx.shadowColor = dw.colorGlow;
              duckCtx.shadowBlur = 2.5;
              duckCtx.strokeStyle = dw.colorMain;
              duckCtx.lineWidth = Math.max(1.5, R * 0.065);
              duckCtx.beginPath();
              duckCtx.moveTo(-mw, my);
              duckCtx.quadraticCurveTo(0, ctrlY, mw, my);
              duckCtx.stroke();

              duckCtx.fillStyle = "#ffffff";
              duckCtx.beginPath();
              duckCtx.ellipse(-ex, ey, er, er * blink, 0, 0, TAU);
              duckCtx.ellipse(ex, ey, er, er * blink, 0, 0, TAU);
              duckCtx.fill();

              const tag = emotionTags[dw.stampIdx % emotionTags.length];
              duckCtx.font = `500 ${Math.max(10, Math.floor(R * 0.56))}px "Instrument Serif", Georgia, serif`;
              duckCtx.textAlign = "center";
              duckCtx.textBaseline = "middle";
              duckCtx.shadowBlur = 0;
              duckCtx.lineWidth = 2.0;
              duckCtx.strokeStyle = "rgba(10, 14, 42, 0.78)";
              duckCtx.strokeText(tag, R * 0.92, -R * 0.52);
              duckCtx.fillStyle = dw.colorMain;
              duckCtx.fillText(tag, R * 0.92, -R * 0.52);
            } else if (dw.kind === "letter") {
              const stamp = getStamp(dw.ch, dw.styleIdx);
              const drawD = radPx * 2.15;
              duckCtx.drawImage(stamp, -drawD * 0.5, -drawD * 0.5, drawD, drawD);
            }

            duckCtx.restore();
          }

          lcGl.activeTexture(lcGl.TEXTURE1);
          lcGl.bindTexture(lcGl.TEXTURE_2D, duckweedTex);
          lcGl.pixelStorei(lcGl.UNPACK_FLIP_Y_WEBGL, false);
          lcGl.texSubImage2D(lcGl.TEXTURE_2D, 0, 0, 0, lcGl.RGBA, lcGl.UNSIGNED_BYTE, duckweedCanvas);
          lcGl.generateMipmap(lcGl.TEXTURE_2D);
        }

        function isOccludedByFountain(px, py, pz, roX, roY, roZ) {
          const dx = px - roX, dy = py - roY, dz = pz - roZ;
          const lenXZ2 = dx * dx + dz * dz;
          if (lenXZ2 < 0.0001) return false;

          const tClosest = -(roX * dx + roZ * dz) / lenXZ2;
          if (tClosest > 0.05 && tClosest < 0.94) {
            const cy = roY + dy * tClosest;
            const cx = roX + dx * tClosest;
            const cz = roZ + dz * tClosest;
            const rClosest = Math.hypot(cx, cz);
            const pillarR = cy < 1.04 ? 0.23 : 0.12;
            if (cy > 0.35 && cy < 2.22 && rClosest < pillarR) return true;
          }

          if (Math.abs(dy) > 0.001) {
            const tUpper = (UPPER_Y - 0.05 - roY) / dy;
            if (tUpper > 0.05 && tUpper < 0.94) {
              const rHit = Math.hypot(roX + dx * tUpper, roZ + dz * tUpper);
              if (rHit < UPPER_R * 0.95) return true;
            }
            const tLower = (LOWER_Y - 0.06 - roY) / dy;
            if (tLower > 0.05 && tLower < 0.94) {
              const rHit = Math.hypot(roX + dx * tLower, roZ + dz * tLower);
              if (rHit < LOWER_R * 0.95) return true;
            }
          }
          return false;
        }

        function resizeLC() {
          const rect = container.getBoundingClientRect();
          width = Math.max(320, Math.floor(rect.width || window.innerWidth));
          height = Math.max(240, Math.floor(rect.height || window.innerHeight));
          const dpr = Math.min(window.devicePixelRatio || 1, 1.5);

          [backCanvas, frontCanvas].forEach((cvs) => {
            cvs.width = Math.floor(width * dpr);
            cvs.height = Math.floor(height * dpr);
          });
          backCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
          frontCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

          const glDpr = Math.min(window.devicePixelRatio || 1, 1.6);
          lcGlCanvas.width = Math.floor(width * glDpr);
          lcGlCanvas.height = Math.floor(height * glDpr);

          bgStreams.length = 0;
          const cols = Math.min(52, Math.floor(width / 24));
          for (let i = 0; i < cols; i++) {
            const layer = i % 3;
            const count = 9 + (i % 5);
            const fixedGlyphs = [];
            for (let c = 0; c < count; c++) {
              fixedGlyphs.push(bgChars[(i * 7 + c * 3) % bgChars.length]);
            }
            bgStreams.push({
              x: (i + 0.5) * (width / cols),
              y: Math.random() * height,
              count,
              fixedGlyphs,
              spacing: 18,
              speed: 0.85 + Math.random() * 0.9,
              alpha: layer === 0 ? 0.52 : layer === 1 ? 0.38 : 0.28,
              size: layer === 0 ? 12.0 : 10.8,
              maxY: height * 0.92,
              styleIdx: i % 2 === 0 ? 5 : 6
            });
          }

          if (nozzles.length === 0) {
            initNozzles();
          }
        }

        function renderLCOverlay(dt, stageOffsetX, stageOffsetY) {
          backCtx.clearRect(0, 0, width, height);
          frontCtx.clearRect(0, 0, width, height);

          for (let i = 0; i < bgStreams.length; i++) {
            const bs = bgStreams[i];
            bs.y += bs.speed;
            const totalLen = bs.count * bs.spacing;
            if (bs.y - totalLen > bs.maxY) bs.y = -Math.random() * height * 0.25;

            const drawW = bs.size * 1.75;
            for (let c = 0; c < bs.count; c++) {
              const yPos = bs.y - c * bs.spacing;
              if (yPos < -10 || yPos > bs.maxY) continue;
              const alpha = bs.alpha * (1 - (c / bs.count) * 0.55);
              const ch = bs.fixedGlyphs[c];
              const stamp = getStamp(ch, bs.styleIdx);
              backCtx.globalAlpha = alpha;
              backCtx.drawImage(stamp, bs.x - drawW * 0.5, yPos - drawW * 0.5, drawW, drawW);
            }
          }

          const ang = lcState.camAng;
          const camH = lcState.camHeight;
          const dist = lcState.cameraDist;
          const roX = dist * Math.cos(ang);
          const roY = camH;
          const roZ = dist * Math.sin(ang);

          let zx = lcState.lookAt[0] - roX, zy = lcState.lookAt[1] - roY, zz = lcState.lookAt[2] - roZ;
          const zLen = Math.hypot(zx, zy, zz) || 1;
          zx /= zLen; zy /= zLen; zz /= zLen;

          let xx = -zz, xy = 0, xz = zx;
          const xLen = Math.hypot(xx, xy, xz) || 1;
          xx /= xLen; xz /= xLen;

          const yx = xy * zz - xz * zy;
          const yy = xz * zx - xx * zz;
          const yz = xx * zy - xy * zx;

          const minDim = Math.min(width, height);
          const pitchSquash = Math.max(0.32, Math.min(0.88, Math.abs(zy) + 0.14));
          const sizeScale = lcState.fontSizeScale;
          const focal = lcState.focal;

          function project3D(wx, wy, wz) {
            const rx = wx - roX, ry = wy - roY, rz = wz - roZ;
            const cz = rx * zx + ry * zy + rz * zz;
            if (cz <= 0.2) return null;
            const cx = rx * xx + ry * xy + rz * xz;
            const cy = rx * yx + ry * yy + rz * yz;

            const uvX = (cx / cz) * focal + stageOffsetX;
            const uvY = (cy / cz) * focal + stageOffsetY;

            return {
              sx: 0.5 * (uvX * minDim + width),
              sy: 0.5 * (height - uvY * minDim),
              cz,
              scale: (focal * minDim) / (cz * 680)
            };
          }

          frontCtx.save();
          frontCtx.globalCompositeOperation = "screen";
          for (let i = impactRings.length - 1; i >= 0; i--) {
            const ir = impactRings[i];
            ir.r += dt * 0.55;
            ir.alpha *= 0.89;
            if (ir.alpha < 0.02 || ir.r > ir.maxR) {
              impactRings.splice(i, 1);
              continue;
            }
            const proj = project3D(ir.x, ir.y, ir.z);
            if (!proj) continue;
            const rx = Math.max(4, ir.r * proj.scale * 115);
            const ry = rx * pitchSquash;
            frontCtx.save();
            frontCtx.translate(proj.sx, proj.sy);
            frontCtx.scale(1, ry / rx);
            const grad = frontCtx.createRadialGradient(0, 0, 0, 0, 0, rx);
            const rgb = ir.styleIdx === 2 ? "255, 195, 242" : "175, 232, 255";
            grad.addColorStop(0, `rgba(${rgb}, ${ir.alpha * 0.28})`);
            grad.addColorStop(1, `rgba(${rgb}, 0)`);
            frontCtx.fillStyle = grad;
            frontCtx.beginPath();
            frontCtx.arc(0, 0, rx, 0, TAU);
            frontCtx.fill();
            frontCtx.restore();
          }
          frontCtx.restore();

          const renderQueue = [];
          for (let i = 0; i < travelers.length; i++) {
            const p = travelers[i];
            const proj = project3D(p.x, p.y, p.z);
            if (!proj || proj.sx < -40 || proj.sx > width + 40 || proj.sy < -40 || proj.sy > height + 40) {
              continue;
            }
            renderQueue.push({ p, proj });
          }
          renderQueue.sort((a, b) => b.proj.cz - a.proj.cz);

          for (let i = 0; i < renderQueue.length; i++) {
            const { p, proj } = renderQueue[i];
            const occluded = isOccludedByFountain(p.x, p.y, p.z, roX, roY, roZ);
            const fadeIn = Math.min(1.0, p.age / 0.04);
            const alpha = (occluded ? 0.22 : 0.96) * fadeIn;

            const stamp = getStamp(p.ch, p.styleIdx);
            // Gently compress extreme telephoto magnification so close-up letters stay crisp and unintrusive
            const dampedScale = proj.scale / (1.0 + Math.max(0.0, proj.scale - 1.25) * 0.45);
            const drawW = p.size * sizeScale * dampedScale * 1.85;
            const squash = p.squashTimer > 0 ? (p.squashTimer / 0.15) * 0.38 : 0;

            frontCtx.save();
            frontCtx.globalAlpha = alpha;
            frontCtx.translate(proj.sx, proj.sy);

            if (!p.bouncedInStage) {
              const nextProj = project3D(p.x + p.vx * 0.03, p.y + p.vy * 0.03, p.z + p.vz * 0.03);
              let tangentAng = 0;
              if (nextProj) {
                let rawAng = Math.atan2(nextProj.sy - proj.sy, nextProj.sx - proj.sx);
                if (rawAng > Math.PI * 0.5) rawAng -= Math.PI;
                if (rawAng < -Math.PI * 0.5) rawAng += Math.PI;
                tangentAng = rawAng * 0.42;
              }
              frontCtx.rotate(tangentAng);
            } else {
              frontCtx.rotate(p.spin);
              frontCtx.scale(1.0 + squash, 1.0 - squash * 0.6);
            }

            frontCtx.drawImage(stamp, -drawW * 0.5, -drawW * 0.5, drawW, drawW);
            frontCtx.restore();
          }

          backCtx.globalAlpha = 1;
          frontCtx.globalAlpha = 1;
        }

        let lcFrameCount = 0;
        let lcSimTime = 0;

        function prewarmWaveAndParticles() {
          const dtStep = 0.02;
          for (let s = 0; s < 24; s++) {
            lcSimTime += dtStep * lcState.flowSpeed;
            stepFluidAndDuckweedPhysics(dtStep, lcSimTime, lcSimTime);

            const readFBO = waveFBOs[pingPongIdx];
            const writeFBO = waveFBOs[1 - pingPongIdx];
            lcGl.bindFramebuffer(lcGl.FRAMEBUFFER, writeFBO.fbo);
            lcGl.viewport(0, 0, SIM_SIZE, SIM_SIZE);
            lcGl.disable(lcGl.BLEND);
            lcGl.useProgram(bufferAProg);
            lcGl.activeTexture(lcGl.TEXTURE0);
            lcGl.bindTexture(lcGl.TEXTURE_2D, readFBO.tex);
            lcGl.uniform1i(bufUniforms.iChannel0, 0);
            lcGl.uniform3f(bufUniforms.iResolution, SIM_SIZE, SIM_SIZE, 1.0);
            lcGl.uniform1f(bufUniforms.iTime, lcSimTime);
            lcGl.uniform1f(bufUniforms.iTimeDelta, dtStep * lcState.flowSpeed);
            lcGl.uniform1i(bufUniforms.iFrame, lcFrameCount);
            lcGl.bindBuffer(lcGl.ARRAY_BUFFER, quadBuf);
            const aPosBuf = lcGl.getAttribLocation(bufferAProg, "aPosition");
            lcGl.enableVertexAttribArray(aPosBuf);
            lcGl.vertexAttribPointer(aPosBuf, 2, lcGl.FLOAT, false, 0, 0);
            lcGl.drawArrays(lcGl.TRIANGLES, 0, 6);
            pingPongIdx = 1 - pingPongIdx;
            lcFrameCount++;
          }
          lcGl.bindFramebuffer(lcGl.FRAMEBUFFER, null);
        }

        function renderStep(timeSec, dt) {
          if (lcGlCanvas.width < 10 || lcGlCanvas.height < 10) {
            resizeLC();
          }

          lcSimTime += dt * lcState.flowSpeed;

          const curChap = LC_CAMERA_CHAPTERS[lcState.chapterIdx];
          lcState.chapterTimer += dt;
          if (lcState.chapterTimer >= (curChap.duration || 7.2)) {
            applyLCChapter(lcState.chapterIdx + 1);
          }

          const activeChap = LC_CAMERA_CHAPTERS[lcState.chapterIdx];
          lcState.camAng += dt * activeChap.angSpeed;

          const camDamp = 1.0 - Math.exp(-1.55 * dt);
          const breathH = Math.sin(timeSec * 0.45) * 0.05;
          const breathDist = Math.cos(timeSec * 0.38) * 0.06;

          lcState.camHeight += (lcState.targetHeight + breathH - lcState.camHeight) * camDamp;
          lcState.cameraDist += (lcState.targetDist + breathDist - lcState.cameraDist) * camDamp;
          lcState.focal += (lcState.targetFocal - lcState.focal) * camDamp;
          lcState.rFocus += (lcState.targetRFocus - lcState.rFocus) * camDamp;
          lcState.yFocus += (lcState.targetYFocus - lcState.yFocus) * camDamp;
          lcState.sideAng += (lcState.targetSideAng - lcState.sideAng) * camDamp;

          const focusAng = lcState.camAng + lcState.sideAng;
          lcState.lookAt[0] = lcState.rFocus * Math.cos(focusAng);
          lcState.lookAt[1] = lcState.yFocus;
          lcState.lookAt[2] = lcState.rFocus * Math.sin(focusAng);

          lcState.panX += (lcState.targetPanX - lcState.panX) * camDamp;
          lcState.panY += (lcState.targetPanY - lcState.panY) * camDamp;
          lcState.surgeGlow = Math.max(0, lcState.surgeGlow - dt * 0.6);

          stepFluidAndDuckweedPhysics(dt, timeSec, lcSimTime);
          renderDuckweedSurfaceTexture(timeSec);

          const readFBO = waveFBOs[pingPongIdx];
          const writeFBO = waveFBOs[1 - pingPongIdx];

          lcGl.bindFramebuffer(lcGl.FRAMEBUFFER, writeFBO.fbo);
          lcGl.viewport(0, 0, SIM_SIZE, SIM_SIZE);
          lcGl.disable(lcGl.BLEND);
          lcGl.useProgram(bufferAProg);

          lcGl.activeTexture(lcGl.TEXTURE0);
          lcGl.bindTexture(lcGl.TEXTURE_2D, readFBO.tex);
          lcGl.uniform1i(bufUniforms.iChannel0, 0);
          lcGl.uniform3f(bufUniforms.iResolution, SIM_SIZE, SIM_SIZE, 1.0);
          lcGl.uniform1f(bufUniforms.iTime, lcSimTime);
          lcGl.uniform1f(bufUniforms.iTimeDelta, dt * lcState.flowSpeed);
          lcGl.uniform1i(bufUniforms.iFrame, lcFrameCount);

          lcGl.bindBuffer(lcGl.ARRAY_BUFFER, quadBuf);
          const aPosBuf = lcGl.getAttribLocation(bufferAProg, "aPosition");
          lcGl.enableVertexAttribArray(aPosBuf);
          lcGl.vertexAttribPointer(aPosBuf, 2, lcGl.FLOAT, false, 0, 0);
          lcGl.drawArrays(lcGl.TRIANGLES, 0, 6);

          pingPongIdx = 1 - pingPongIdx;
          lcFrameCount++;

          lcGl.bindFramebuffer(lcGl.FRAMEBUFFER, null);
          lcGl.viewport(0, 0, lcGlCanvas.width, lcGlCanvas.height);
          lcGl.enable(lcGl.BLEND);
          lcGl.clearColor(0, 0, 0, 0);
          lcGl.clear(lcGl.COLOR_BUFFER_BIT);

          lcGl.useProgram(imageProg);
          lcGl.activeTexture(lcGl.TEXTURE0);
          lcGl.bindTexture(lcGl.TEXTURE_2D, writeFBO.tex);
          lcGl.uniform1i(imgUniforms.iChannel0, 0);

          lcGl.activeTexture(lcGl.TEXTURE1);
          lcGl.bindTexture(lcGl.TEXTURE_2D, duckweedTex);
          lcGl.uniform1i(imgUniforms.uDuckweedTex, 1);
          lcGl.uniform4fv(imgUniforms.uLilyPads, lilyPadUniformData);

          lcGl.uniform3f(imgUniforms.iResolution, lcGlCanvas.width, lcGlCanvas.height, 1.0);
          lcGl.uniform1f(imgUniforms.iTime, timeSec);
          lcGl.uniform1f(imgUniforms.uSimTime, lcSimTime);
          lcGl.uniform2f(imgUniforms.uCameraAngles, lcState.camAng, lcState.camHeight);
          lcGl.uniform3f(imgUniforms.uLookAt, lcState.lookAt[0], lcState.lookAt[1], lcState.lookAt[2]);
          lcGl.uniform1f(imgUniforms.uCameraDist, lcState.cameraDist);
          lcGl.uniform1f(imgUniforms.uFocal, lcState.focal);
          lcGl.uniform2f(imgUniforms.uStageOffset, lcState.panX, lcState.panY);
          lcGl.uniform1f(imgUniforms.uGrassRadius, lcState.grassRadius);
          lcGl.uniform1f(imgUniforms.uLavenderTint, lcState.lavenderTint);
          lcGl.uniform1f(imgUniforms.uSurgeGlow, lcState.surgeGlow);

          lcGl.bindBuffer(lcGl.ARRAY_BUFFER, quadBuf);
          const aPosImg = lcGl.getAttribLocation(imageProg, "aPosition");
          lcGl.enableVertexAttribArray(aPosImg);
          lcGl.vertexAttribPointer(aPosImg, 2, lcGl.FLOAT, false, 0, 0);
          lcGl.drawArrays(lcGl.TRIANGLES, 0, 6);

          renderLCOverlay(dt, lcState.panX, lcState.panY);
        }

        resizeLC();
        prewarmWaveAndParticles();
        applyLCChapter(0, true);
        window.addEventListener("resize", resizeLC);

        return { renderStep, resize: resizeLC };
      }

      // ==================== 3. Application Bootstrap ====================
      window.addEventListener("DOMContentLoaded", () => {
        const fountainJelly = createJellyDialogBox(
          "lcJellyCanvas",
          "The Fountain",
          [
            "Words rise from the carved stone fountain and drift softly into the water below."
          ],
          { boxHalfW: 1.65, boxHalfH: 0.305, tabHalfH: 0.088, tabRad: 0.082 }
        );

        const fountainApp = initLavenderCourtSubpage(fountainJelly);
        let lastTime = performance.now();

        function tick(now) {
          const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) * 0.001));
          lastTime = now;
          const timeSec = now * 0.001;

          if (fountainApp) {
            fountainApp.renderStep(timeSec, dt);
          }
          if (fountainJelly) {
            fountainJelly.render(timeSec);
          }
          requestAnimationFrame(tick);
        }

        requestAnimationFrame(tick);
      });
    </script>
  </body>
</html>
